# qwen3-asr-qwen3-tts-vivian with Qwen3-ASR streaming each utterance through its realtime transcription session, so the user's words arrive as partial transcripts while they speak.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/qwen3-asr-streaming-qwen3-tts-vivian

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3.8-27B, --port, "8000", --mem-fraction-static, "0.85"]
    port: 8000
    env: {CUDA_VISIBLE_DEVICES: "0"}
  - name: asr
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --enable-realtime, --port, "8002", --mem-fraction-static, "0.08"]
    port: 8002
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-Base, --config, examples/configs/qwen3_tts_1_7b.yaml, --port, "8005", --mem-fraction-static, "0.12"]
    port: 8005
    env: {CUDA_VISIBLE_DEVICES: "1"}

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: streaming_transcription
    inputs: [input, "vad:session"]
    base_url: "ws://127.0.0.1:8002"
    model: Qwen/Qwen3-ASR-1.7B
    decode_interval_ms: 1000
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: You are a helpful voice assistant. Answer in one spoken sentence of at most 25 words, in the language the user speaks. Do not use markdown or emoji.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8000/v1"
    model: Qwen/Qwen3.8-27B
    max_tokens: 512
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  tts:
    kind: openai_speech
    inputs:
      - llm
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8005/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    reference_audio_path: examples/streaming_cascade/voices/vivian.wav
    language: auto
  aligner:
    kind: alignment
    method: forced
    alignment_url: "http://127.0.0.1:8010"
    heard_asr_url: "http://127.0.0.1:8002/v1"
    heard_asr_model: Qwen/Qwen3-ASR-1.7B
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  llm: [text_delta]
  tts: [pcm_f32le, session]
  aligner: [session]
