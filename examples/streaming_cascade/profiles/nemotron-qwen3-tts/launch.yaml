# Nemotron streaming ASR, Qwen3-4B and Qwen3-TTS as services, with the VAD node beside the cascade.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/nemotron-qwen3-tts

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3-4B-Instruct-2507, --port, "8000", --mem-fraction-static, "0.30"]
    port: 8000
  - name: asr
    command: [sgl-omni, serve, --model-path, nvidia/nemotron-3.5-asr-streaming-0.6b, --enable-realtime, --port, "8001"]
    port: 8001
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-0.6B-Base, --config, examples/configs/qwen3_tts_0_6b.yaml, --port, "8004", --mem-fraction-static, "0.08"]
    port: 8004

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: realtime_transcription
    inputs: [input, "vad:session"]
    base_url: "ws://127.0.0.1:8001"
    model: nvidia/nemotron-3.5-asr-streaming-0.6b
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: You are a helpful voice assistant. Answer in one spoken sentence of at most 25 words, in the language the user speaks. Do not use markdown or emoji.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8000/v1"
    model: Qwen/Qwen3-4B-Instruct-2507
    max_tokens: 512
  tts:
    kind: openai_speech
    inputs:
      - llm
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8004/v1"
    model: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    voice: default
    reference_audio_path: reference.wav
    reference_text: The transcript of reference.wav.
    language: auto
  aligner:
    kind: alignment
    method: forced
    alignment_url: "http://127.0.0.1:8010"
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  llm: [text_delta]
  tts: [pcm_f32le, session]
