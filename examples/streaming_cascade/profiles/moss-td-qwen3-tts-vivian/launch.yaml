# MOSS-Transcribe-Diarize transcribes each utterance with speaker labels that hold for the whole session, Qwen3.8-27B answers with thinking off and Qwen3-TTS Base speaks it in the voice of one Vivian recording, each a service of its own, with the VAD node beside the cascade.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/moss-td-qwen3-tts-vivian

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3.8-27B, --reasoning-parser, qwen3, --port, "8000", --mem-fraction-static, "0.85"]
    port: 8000
    env: {CUDA_VISIBLE_DEVICES: "0"}
  - name: asr
    command: [sgl-omni, serve, --model-path, OpenMOSS-Team/MOSS-Transcribe-Diarize, --port, "8002", --mem-fraction-static, "0.15"]
    port: 8002
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-Base, --config, examples/configs/qwen3_tts_1_7b.yaml, --port, "8005", --mem-fraction-static, "0.12"]
    port: 8005
    env: {CUDA_VISIBLE_DEVICES: "1"}

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: speaker_transcription
    inputs: [input, "vad:session"]
    base_url: "http://127.0.0.1:8002/v1"
    model: OpenMOSS-Team/MOSS-Transcribe-Diarize
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: You are a helpful voice assistant talking with one or more people. Each line of a user message starts with the label of the person who said it, such as [S01], and a label names the same person for the whole conversation. Answer the person who spoke to you in one spoken sentence of at most 25 words, in the language they speak. Do not say the labels, and do not use markdown or emoji.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8000/v1"
    model: Qwen/Qwen3.8-27B
    max_tokens: 512
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  tts:
    kind: openai_speech
    inputs:
      - llm
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8005/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    reference_audio_path: examples/streaming_cascade/voices/vivian.wav
    language: auto
  aligner:
    kind: alignment
    method: forced
    alignment_url: "http://127.0.0.1:8010"
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  llm: [text_delta]
  tts: [pcm_f32le, session]
  aligner: [session]
