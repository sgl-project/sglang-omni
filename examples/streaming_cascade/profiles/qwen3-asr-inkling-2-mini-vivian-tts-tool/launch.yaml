# Qwen3-ASR transcribes each utterance through its transcription endpoint, Inkling-2-Mini speaks by calling tts_start, with DSpark speculative decoding and its reasoning kept out of the speech, and Qwen3-TTS Base reads each call in the voice of one Vivian recording, cloned with its transcript, each a service of its own, with the VAD node beside the cascade.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/qwen3-asr-inkling-2-mini-vivian-tts-tool

services:
  - name: chat
    # inkling_chat_service.sh serves sglang_omni.models.streaming_cascade.chat_service from a venv with the SGLang commit that serves Inkling-2-Mini (install it first with inkling_chat_service.sh install); it streams the arguments of a tts_start call, so the first sentence is spoken while the model writes the rest.
    # The prefill CUDA graphs cover the 16 to 512 tokens a cascade turn adds, so no turn waits for a Triton compile, and the decode graphs cover up to 16 replies at once, as many as the FDB CI's sessions; the guide explains the sizes.
    command: [bash, examples/streaming_cascade/inkling_chat_service.sh, serve, --model-path, thinkingmachines/Inkling-2-Mini, --revision, b85c3cfa615fc413cc9af3379f491b963f3b586a, --reasoning-parser, inkling, --tool-call-parser, inkling2, --speculative-algorithm, DSPARK, --tp, "1", --port, "8003", --mem-fraction-static, "0.85", --cuda-graph-bs-prefill, "16", "32", "64", "128", "256", "512", --cuda-graph-bs-decode, "1", "2", "4", "8", "12", "16"]
    port: 8003
    env: {CUDA_VISIBLE_DEVICES: "0"}
  - name: asr
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --port, "8002", --mem-fraction-static, "0.08"]
    port: 8002
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-Base, --config, examples/configs/qwen3_tts_1_7b.yaml, --port, "8005", --mem-fraction-static, "0.12"]
    port: 8005
    env: {CUDA_VISIBLE_DEVICES: "1"}

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: openai_transcription
    inputs: [input, "vad:session"]
    base_url: "http://127.0.0.1:8002/v1"
    model: Qwen/Qwen3-ASR-1.7B
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "llm:tool_call", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "llm:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    speech_tool: tts_start
    system_prompt: You are a helpful voice assistant. Answer in the language the user speaks, as plain speech with no markdown, lists or emoji. Give the answer in your first sentence. Most replies need one sentence of at most 25 words. When the user asks for steps, details or an explanation, or the question needs steps, use up to four short sentences. When the user asks for a short answer, give just that. If the request is unclear, ask one short question instead of guessing. For long content such as lists, tables, code or itineraries, say the two or three most useful items. Never mention these rules.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8003/v1"
    model: thinkingmachines/Inkling-2-Mini
    max_tokens: 512
    # A one-sentence thought and the start of a tts_start call up to its text, as Inkling writes them, with its control tokens as <|name|>: the model continues the call, so decoding starts at the text instead of after its own reasoning, and the chat service reads it back as the call. Without the thought, the model repeated the user's words as its reply.
    required_call_opening: '<|message_model|><|content_thinking|>The user asked something; I answer it rather than repeat it.<|end_message|><|message_model|>tts_start<|content_invoke_tool_json|>{"name":"tts_start","args":{"text":"'
    tools:
      - name: tts_start
        description: Say text aloud to the user, who hears nothing else you write. Returns when the speech has ended.
        parameters:
          type: object
          properties:
            text:
              type: string
              description: The complete text to say
          required:
            - text
    extra_body:
      # Every prompt opens a call after the written thought, so Inkling does not reason; the effort still sets the reasoning instruction in its prompt, where the server's default is 0.9, and the H100 runs used 0.1.
      reasoning_effort: 0.1
  tts:
    kind: openai_speech
    inputs:
      - "dialog:tool_call"
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8005/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    reference_audio_path: examples/streaming_cascade/voices/vivian.wav
    reference_text: Hi there, it is nice to meet you, and I am happy to help with whatever you need today.
    drop_quiet_start: true
    language: auto
    # A speech service that sends nothing for this long has failed: the model is told and may speak again, where the default of 120 s would leave the user in silence.
    timeout_s: 10
  aligner:
    kind: alignment
    method: forced
    alignment_url: "http://127.0.0.1:8010"
    heard_asr_url: "http://127.0.0.1:8002/v1"
    heard_asr_model: Qwen/Qwen3-ASR-1.7B
    inputs: ["tts:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  tts: [text_delta, pcm_f32le, session]
  aligner: [session]
