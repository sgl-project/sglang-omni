# The qwen3-asr-qwen3.8-27b-vivian-tools cascade with a scene the user directs by voice: beside get_weather, search_wikipedia and generate_image, Qwen3.8-27B is offered generate_video, which a video node answers with VDN-H3 (MiniMax-H3 with an 8-step distillation) served by sglang on GPUs 2 and 3, in fp8 at a 384-pixel short edge so that a clip of four seconds takes four to five seconds, about as long as it plays. Each call adds a clip to the scene, continuing from the last frame of the clip before; the client receives each clip in pieces (`sglang.video.delta`) the moment it is decoded, its progress meanwhile (`sglang.video.progress`), and the model reports it in a turn of its own. The profile needs four GPUs, outbound HTTPS to the Open-Meteo and Wikipedia APIs, and `PYTHONPATH=.` from the repository root so the tools node imports `examples.streaming_cascade.tools`.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/qwen3-asr-qwen3.8-27b-vivian-video
# A clip of four seconds is under a megabyte; the output budget holds a few of them while a slow client reads.
max_pending_output_bytes: 33554432
max_pending_output_chunks: 256

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3.8-27B, --port, "8003", --mem-fraction-static, "0.85", --tool-call-parser, qwen3_coder, --reasoning-parser, qwen3]
    port: 8003
    env: {CUDA_VISIBLE_DEVICES: "0"}
  - name: asr
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --port, "8002", --mem-fraction-static, "0.08"]
    port: 8002
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-Base, --config, examples/configs/qwen3_tts_1_7b.yaml, --port, "8005", --mem-fraction-static, "0.12"]
    port: 8005
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: image
    command: [sglang, serve, --model-path, Tongyi-MAI/Z-Image-Turbo, --host, "127.0.0.1", --port, "8020"]
    port: 8020
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: video
    command: [sglang, serve, --model-path, OpenVDN/vdn-minimax-h3, --num-gpus, "2", --tp-size, "2", --ulysses-degree, "1", --attention-backend, hybrid_window_attn_h3, --quantization, fp8, --performance-mode, speed, --layerwise-offload-components, text_encoder, --host, "127.0.0.1", --port, "8030"]
    port: 8030
    env: {CUDA_VISIBLE_DEVICES: "2,3"}

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: openai_transcription
    inputs: [input, "vad:session"]
    base_url: "http://127.0.0.1:8002/v1"
    model: Qwen/Qwen3-ASR-1.7B
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "llm:tool_call", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tools:tool_response", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "video:tool_response", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: You are a helpful voice assistant speaking aloud. Use get_weather when the user asks about the weather, search_wikipedia when the user asks you to look something up, generate_image when the user asks for a picture, and generate_video when the user asks for a video or wants the scene they are watching to go on or to change; each generate_video call adds the next clip of the same scene, which the user sees as soon as it is ready, so describe in its prompt only what happens next, and call it only when the user just asked. When you call a tool, first say in one short sentence what you are doing; when a clip's result arrives, tell the user the clip is playing. Reply briefly, in the language the user speaks, without markdown or emoji.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8003/v1"
    model: Qwen/Qwen3.8-27B
    max_tokens: 512
    tools:
      - name: get_weather
        description: Get the current weather of a city.
        parameters:
          type: object
          properties:
            city:
              type: string
              description: The city name, such as Paris or Shanghai
          required:
          - city
      - name: search_wikipedia
        description: Look a topic up on Wikipedia and return the opening summary of the best matching article; it takes a few seconds.
        parameters:
          type: object
          properties:
            query:
              type: string
              description: What to look up
            language:
              type: string
              description: The Wikipedia language edition, such as en or zh; en unless the user speaks another language
          required:
          - query
      - name: generate_image
        description: Draw a picture from a description and show it to the user; it takes a few seconds.
        parameters:
          type: object
          properties:
            prompt:
              type: string
              description: What the picture shows, as one detailed sentence in English or Chinese
          required:
          - prompt
      - name: generate_video
        description: Shoot the next clip of the scene the user is watching, about four seconds with sound, and show it; it takes about five seconds. The clip continues from the end of the previous one unless new_scene is true.
        parameters:
          type: object
          properties:
            prompt:
              type: string
              description: What happens in the clip, as one or two sentences in English describing the motion and the sound
            new_scene:
              type: boolean
              description: true to start a new scene instead of continuing the current one
          required:
          - prompt
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  tools:
    kind: tools
    inputs:
      - "llm:tool_call"
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    tools:
      get_weather: examples.streaming_cascade.tools.get_weather
      search_wikipedia:
        path: examples.streaming_cascade.tools.search_wikipedia
        awaited: false
        on_interrupt: retain
      generate_image:
        path: examples.streaming_cascade.tools.generate_image
        awaited: false
        on_interrupt: retain
    timeout_s: 30
  video:
    kind: openai_video
    inputs:
      - "llm:tool_call"
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8030/v1"
    model: OpenVDN/vdn-minimax-h3
    seconds: 4
    short_edge: 384
    aspect_ratio: "16:9"
    num_inference_steps: 8
    timeout_s: 120
  tts:
    kind: openai_speech
    inputs:
      - llm
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8005/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    reference_audio_path: examples/streaming_cascade/voices/vivian.wav
    language: auto
  aligner:
    kind: alignment
    method: forced
    alignment_url: "http://127.0.0.1:8010"
    heard_asr_url: "http://127.0.0.1:8002/v1"
    heard_asr_model: Qwen/Qwen3-ASR-1.7B
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session, tool_image]
  llm: [text_delta]
  tts: [pcm_f32le, session]
  aligner: [session]
  video: [video_clip, video_progress]
