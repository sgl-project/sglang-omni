# Qwen3-ASR transcribes each utterance through its transcription endpoint, Qwen3.8-27B speaks by calling tts_start, with thinking off, and Qwen3-TTS Base reads each call in the voice of one Vivian recording, cloned with its transcript, each a service of its own, with the VAD node beside the cascade.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/qwen3-asr-qwen3.8-27b-vivian-tts-tool

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3.8-27B, --reasoning-parser, qwen3, --tool-call-parser, qwen3_coder, --port, "8003", --mem-fraction-static, "0.85"]
    port: 8003
    env: {CUDA_VISIBLE_DEVICES: "0"}
  - name: asr
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --port, "8002", --mem-fraction-static, "0.08"]
    port: 8002
    env: {CUDA_VISIBLE_DEVICES: "1"}
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-Base, --config, examples/configs/qwen3_tts_1_7b.yaml, --port, "8005", --mem-fraction-static, "0.12"]
    port: 8005
    env: {CUDA_VISIBLE_DEVICES: "1"}

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: openai_transcription
    inputs: [input, "vad:session"]
    base_url: "http://127.0.0.1:8002/v1"
    model: Qwen/Qwen3-ASR-1.7B
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "llm:tool_call", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "llm:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    speech_tool: tts_start
    system_prompt: >-
      You are a helpful voice assistant. Answer in the language the user speaks, as plain speech with no markdown, lists or emoji. Give the answer in your first sentence. Most replies need one sentence of at most 25 words. When the user asks for steps, details or an explanation, or the question needs steps, use up to four short sentences. When the user asks for a short answer, give just that. If the request is unclear, ask one short question instead of guessing. For long content such as lists, tables, code or itineraries, say the two or three most useful items. Never mention these rules. The user only hears what you pass to the tts_start tool: to say anything, call tts_start with the complete text. Text outside tts_start is never heard. When tts_start answers {"status": "completed"}, the user heard all of it: end your turn without calling anything or writing anything, unless you have more to say. When it answers {"status": "interrupted", "heard_prefix": ...}, the user cut you off and heard only heard_prefix.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8003/v1"
    model: Qwen/Qwen3.8-27B
    max_tokens: 512
    tools:
      - name: tts_start
        description: Say text aloud to the user. Returns when the speech has ended.
        parameters:
          type: object
          properties:
            text:
              type: string
              description: The complete text to say
          required:
            - text
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  tts:
    kind: openai_speech
    inputs:
      - "dialog:tool_call"
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:8005/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    reference_audio_path: examples/streaming_cascade/voices/vivian.wav
    reference_text: Hi there, it is nice to meet you, and I am happy to help with whatever you need today.
    drop_quiet_start: true
    language: auto
  aligner:
    kind: alignment
    method: forced
    alignment_url: "http://127.0.0.1:8010"
    heard_asr_url: "http://127.0.0.1:8002/v1"
    heard_asr_model: Qwen/Qwen3-ASR-1.7B
    inputs: ["tts:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  tts: [text_delta, pcm_f32le, session]
  aligner: [session]
