# SPDX-License-Identifier: Apache-2.0
#
# Qwen3-Omni as a realtime voice assistant over the Session API, on two H100s.
# The Python pipeline config owns the stage topology; this file sets what
# depends on the device: per-stage GPUs and memory budgets and the number of
# concurrent sessions those budgets hold.
#
# The thinker and talker fractions are the disaggregated BF16 speech CI
# server's. One H100 cannot hold the BF16 thinker, talker, encoders and their
# working memory together under audio input, so the thinker and the image
# encoder take GPU 0 and the talker and code2wav GPU 1. The audio encoder runs on
# GPU 1 as well: across inputs of varying length it grows past twice its
# budget, and GPU 1 keeps over 40 GB free while GPU 0 keeps about 6 GB.
# max_sessions: the thinker's KV pool at these fractions holds 83,502 tokens,
# and a session retains at most max_seq_len (32768) thinker tokens, so two
# full-length conversations fit. This file sets four for short conversations
# such as the Full-Duplex-Bench CI's, whose sessions stay far below 20,875
# tokens each (83,502 / 4); four recorded its 60 sessions in about 4 minutes
# without a failure, where two took 8. Set 2 for full-length conversations.
config_cls: Qwen3OmniSessionPipelineConfig
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct
max_sessions: 4

stages:
  image_encoder:
    gpu: 0
    gpu_memory_fraction: 0.02
  audio_encoder:
    gpu: 1
    gpu_memory_fraction: 0.02
  thinker:
    gpu: 0
    gpu_memory_fraction: 0.82
    engine:
      cuda_graph_backend_prefill: breakable
      cuda_graph_max_bs_prefill: 2048
  talker_ar:
    gpu: 1
    gpu_memory_fraction: 0.40
  code2wav:
    gpu: 1
    gpu_memory_fraction: 0.02

session_nodes:
  vad:
    stages: [vad]
    inputs: ["input:pcm16", "input:session"]
  qwen_omni:
    stages: [preprocessing, image_encoder, audio_encoder, thinker, talker_ar, code2wav]
    inputs:
      - "dialog:qwen.unit"
      - {kind: control, source: input, event: configure}
      - {kind: control, source: dialog, event: interrupt, preempt: true}
      - {kind: control, source: dialog, event: qwen.truncate}
  dialog:
    stages: [dialog]
    inputs:
      - "input:pcm16"
      - "input:session"
      - "input:image_frame"
      - "vad:session"
      - {kind: control, source: input, event: interrupt, preempt: true}
      # A reply publishes three controls (turn.started, reply.progress, turn.done) and the dialog
      # starts the next reply only once it took turn.done, so with an interrupted reply leaving at
      # most two behind, the default capacity of 16 never drops one.
      - {source: "qwen_omni:session", feedback: true, overflow: drop_oldest}

session_publish:
  vad: [session]
  dialog: [session]
  qwen_omni: [pcm_f32le, session, text_delta]
