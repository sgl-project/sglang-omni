config_cls: MingTTSPipelineConfig
model_path: inclusionAI/Ming-omni-tts-16.8B-A3B
name: ming-omni-tts-apple-mlx
# Requires SGLANG_USE_MLX=1. Initial Q4 profile; broader qualification pending.
# Provisional placement budgets total 0.80; not measured peaks or MLX hard limits.
stages:
  preprocessing:
    process: preprocessing
    factory:
      context_length: 2048
      max_decode_steps_cap: 256
      max_concurrency: 1
  reference_encode:
    process: ming_tts_aux
    gpu: 0
    gpu_memory_fraction: 0.08
    factory:
      context_length: 2048
      max_concurrency: 1
  tts_engine:
    process: tts_engine
    gpu: 0
    tp_size: 1
    gpu_memory_fraction: 0.60
    factory:
      context_length: 2048
    engine:
      quantization: mlx_q4
      disable_cuda_graph: true
      disable_overlap_schedule: true
      disable_radix_cache: true
      enable_torch_compile: false
      max_running_requests: 1
      max_total_tokens: 2048
      max_prefill_tokens: 2048
      chunked_prefill_size: 0
      attention_backend: torch_native
      sampling_backend: pytorch
      trust_remote_code: false
  audio_decode:
    process: ming_tts_aux
    gpu: 0
    gpu_memory_fraction: 0.12
    factory:
      initial_chunk_patches: 2
      steady_chunk_patches: 4
      streaming_cuda_graph: false
      stream_slots: 1
      max_batch_size: 1
      max_batch_wait_ms: 0
