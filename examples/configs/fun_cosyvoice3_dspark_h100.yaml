# SPDX-License-Identifier: Apache-2.0
# Run with NVIDIA MPS and OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 in the launch environment.
config_cls: FunCosyVoice3PipelineConfig
name: fun-cosyvoice3-dspark-h100
model_path: FunAudioLLM/Fun-CosyVoice3-0.5B-2512

stages:
  tts_engine:
    gpu_memory_fraction: 0.15
    factory:
      onnx_intra_op_threads: 4
    engine:
      attention_backend: fa3
      disable_radix_cache: true
      speculative_algorithm: DSPARK
      speculative_draft_model_path: yuekai/cosyvoice3_llm_dspark
      speculative_draft_model_revision: 0b1b28dbb751bac3b74eea5dcc11e0570c91563b
  vocoder:
    process: vocoder
    factory:
      max_batch_size: 8
      should_complete_first_chunk_immediately: true
      flow_prefix_cache_gb: 32
    gpu_memory_fraction: 0.75
