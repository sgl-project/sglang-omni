config_cls: WhisperASRPipelineConfig
name: whisper-large-v3-speculative
model_path: openai/whisper-large-v3

stages:
  asr:
    engine:
      speculative_algorithm: STANDALONE
      speculative_draft_model_path: wilsonzheng0327/Whisper-large-v3-distil-draft
      speculative_num_steps: 7
    factory:
      # note (Haoling Pu): a smaller encoder batch cuts first streamed text at c16 under the draft (146 -> 124 ms on H100); the no-draft default stays 8 for throughput at high concurrency.
      pre_lm_max_batch_size: 2
