# PersonaPlex full-duplex sessions with an AVTR-1 avatar node: a talking and listening head from the agent's audio and the user's, one JPEG per 40 ms on the Session input timeline, published as jpeg_frame beside the reply, rendered by an AVTR-1 renderer service worker started beforehand on port 8020 (docs/developer_reference/full_duplex_guide.md, Stage avatar).
# The avatar node reads the user's 24 kHz input and the speech node's personaplex_reply units, which play at their own stamps, silence included; a chunk lip-syncs 405 ms of the agent's audio ahead, so it waits until the units reach that far.
# Serve with: sgl-omni serve --config examples/configs/personaplex_session_avatar.yaml --enable-realtime
config_cls: PersonaPlexSessionGraphPipelineConfig
model_path: nvidia/personaplex-7b-v1

stages:
  avatar:
    factory:
      # Start the worker on a GPU other than the LM's, which it keeps busy every 80 ms.
      renderer_urls: ["http://127.0.0.1:8020"]
      avatar: maria
      background: plain_white
      width: 640
      height: 360
      jpeg_quality: 75
      sessions_per_renderer: 3
      # PersonaPlex streams the agent's units from the Session's start: chunks wait for them from the first one on.
      reply_stream: true

session_nodes:
  speech:
    stages: [preprocessing, mimi_encode, lm, code2wav]
    inputs: [input]
  avatar:
    stages: [avatar]
    inputs: ["input:pcm16", "speech:personaplex_reply"]

session_publish:
  speech: [personaplex_reply]
  avatar: [jpeg_frame]
