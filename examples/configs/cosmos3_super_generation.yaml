# Starting allocation for Super; requires GPU correctness and memory qualification.
config_cls: Cosmos3PipelineConfig
name: cosmos3-super-generation
model_path: nvidia/Cosmos3-Super@fe77b66696d645f663b8f27e942b3b43e4629e23

stages:
  generation:
    gpu: 0
    runtime_gpu_ids: [0, 1]
    # One Omni owner; native SGLang creates its own workers.
    tp_size: 1
    factory:
      output_dir: outputs/cosmos3-super
      server_args_overrides:
        tp_size: 1
        # Reuse native execution defaults. Do not impose a Ulysses/CFG policy.
        use_fsdp_inference: true
        # 2-GPU node default; widen with runtime_gpu_ids for larger allocations.
        hsdp_shard_dim: 2
        hsdp_replicate_dim: 1
        # Super's DiT does not fit two 80GB GPUs fully resident, so stream it
        # layerwise, keeping 24 of 128 layers on-device (the tuned 2-GPU default:
        # fits the full generation matrix with headroom). Raise runtime_gpu_ids
        # for more GPUs, or lower this for a smaller memory footprint.
        component_residency: {transformer: layerwise-offload}
        layerwise_resident_layers: {transformer: 24}
        warmup_mode: "off"
