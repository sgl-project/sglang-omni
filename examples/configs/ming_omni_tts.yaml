config_cls: MingTTSPipelineConfig
model_path: inclusionAI/Ming-omni-tts-16.8B-A3B
name: ming-omni-tts
# Stage topology (routing, factories, streaming) lives in MingTTSPipelineConfig;
# this file only tunes placement, memory budgets and per-stage knobs.
stages:
  preprocessing:
    process: preprocessing
    factory:
      context_length: 8192
      max_decode_steps_cap: 256
      max_concurrency: 1

  reference_encode:
    process: ming_tts_aux
    gpu: 0
    gpu_memory_fraction: 0.08
    factory:
      dtype: bfloat16
      context_length: 8192
      max_concurrency: 1

  tts_engine:
    process: tts_engine
    gpu: 0
    tp_size: 1
    gpu_memory_fraction: 0.72
    factory:
      dtype: bfloat16
      context_length: 8192
    engine:
      disable_cuda_graph: false
      disable_overlap_schedule: true
      disable_radix_cache: true
      enable_torch_compile: false
      max_prefill_tokens: 8192
      max_running_requests: 8
      sampling_backend: pytorch
      trust_remote_code: false
      chunked_prefill_size: 0
      mem_fraction_static: 0.75
      cuda_graph_bs: [1, 2, 4, 8]
      cuda_graph_max_bs: 8

  audio_decode:
    process: ming_tts_aux
    gpu: 0
    gpu_memory_fraction: 0.12
    factory:
      dtype: bfloat16
      initial_chunk_patches: 2
      steady_chunk_patches: 4
      max_batch_size: 1
      max_batch_wait_ms: 0
