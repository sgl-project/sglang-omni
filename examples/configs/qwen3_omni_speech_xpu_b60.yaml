#
# Qwen3-Omni speech on 8x Intel Arc Pro B60 (24 GB each).
#
#   sgl-omni serve --config examples/configs/qwen3_omni_speech_xpu_b60.yaml
#
# TP=4 so the talker and Code2Wav each get a card no thinker rank uses. A stage sharing a card
# with a thinker rank is time-sliced against it, and every TP rank waits for the slowest, so
# the shared card stalls the whole thinker and the talker together.

config_cls: Qwen3OmniSpeechPipelineConfig
name: qwen3-omni-speech-xpu-b60
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct

stages:
  image_encoder:
    gpu: 0
  audio_encoder:
    gpu: 0

  thinker:
    gpu: [0, 1, 2, 3]
    tp_size: 4
    engine:
      # 14.3 GB of weights per rank at TP=4.
      mem_fraction_static: 0.80

  talker_ar:
    gpu: 4
    engine:
      mem_fraction_static: 0.35

  code2wav:
    gpu: 5
    # 0.02 of a 24 GB card leaves less graph budget than the capture keys need.
    gpu_memory_fraction: 0.05
