config_cls: FunASRPDPipelineConfig
model_path: FunAudioLLM/Fun-ASR-Nano-2512-hf
name: fun-asr-nano-pd-dflash
stages:
  asr:
    gpu_memory_fraction: 0.85
    engine:
      max_running_requests: 8
      disable_decode_cuda_graph: true
      disable_speculative_decoding: false
      speculative_algorithm: DFLASH
      speculative_draft_model_path: wilsonzheng0327/Fun-ASR-Nano-dflash
  asr_decode:
    gpu_memory_fraction: 0.85
    engine:
      max_running_requests: 16
      cuda_graph_max_bs: 16
      cuda_graph_backend_prefill: disabled
      disable_speculative_decoding: false
      speculative_algorithm: DFLASH
      speculative_draft_model_path: wilsonzheng0327/Fun-ASR-Nano-dflash
