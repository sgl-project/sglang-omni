# SPDX-License-Identifier: Apache-2.0
# Qwen3-TTS 1.7B CustomVoice, 3 replicas on one 80 GB H100 under native MPS, measured with sglang-omni 8848e500: the most audio within a p99 stall-free start of 0.5, 1 and 3 s.
# sgl-omni serve --model-path Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice serves this config by default on an H100 (see docs/basic_usage/mps_dp.md).
# Each replica keeps the engine's own request limits and the replicas split the GPU's memory, which served more than any count with the B200 caps of 16 running and 16 queued requests.

config_cls: Qwen3TTSPipelineConfig
model_path: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
mps: 'on'
stages:
  tts_engine:
    gpu: 0
    gpu_memory_fraction: 0.2421
    engine:
      mem_fraction_static: 0.8
      max_total_tokens: 52888
  vocoder:
    gpu: 0
    gpu_memory_fraction: 0.0646
    process: vocoder
processes:
  pipeline:
    num_replicas: 3
    replica_devices: [0, 0, 0]
  vocoder:
    num_replicas: 3
    replica_devices: [0, 0, 0]
