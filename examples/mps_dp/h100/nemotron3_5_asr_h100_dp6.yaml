# Nemotron 3.5 ASR Streaming 0.6B, 6 replicas on one 80 GB H100 under native MPS, measured with sglang-omni 8848e500: the most audio within a p99 request latency of 0.5 s.
# sgl-omni serve --model-path nvidia/nemotron-3.5-asr-streaming-0.6b serves this config by default on an H100 (see docs/basic_usage/mps_dp.md).
# The thread caps are part of the measured config, as on a B200.

config_cls: Nemotron3_5ASRPipelineConfig
model_path: nvidia/nemotron-3.5-asr-streaming-0.6b
mps: 'on'
stages:
  asr:
    gpu: 0
    gpu_memory_fraction: 0.14
    process: asr
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    factory:
      max_batch_size: 16
      session_max_concurrency: 16
processes:
  asr:
    num_replicas: 6
    replica_devices: [0, 0, 0, 0, 0, 0]
