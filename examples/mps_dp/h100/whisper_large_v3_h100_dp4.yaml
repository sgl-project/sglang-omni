# SPDX-License-Identifier: Apache-2.0
# Whisper large-v3, 4 replicas on one 80 GB H100 under native MPS, measured with sglang-omni 8848e500: the most audio within a p99 request latency of 0.5, 1 and 3 s.
# sgl-omni serve --model-path openai/whisper-large-v3 serves this config by default on an H100 (see docs/basic_usage/mps_dp.md).
# Each replica keeps the engine's own request limits and the replicas split the GPU's memory, which served more than any count with the B200 caps of 16 running and 16 queued requests.

config_cls: WhisperASRPipelineConfig
model_path: openai/whisper-large-v3
mps: 'on'
stages:
  asr:
    gpu: 0
    gpu_memory_fraction: 0.23
    process: asr
    engine:
      mem_fraction_static: 0.94
      max_total_tokens: 20935
processes:
  asr:
    num_replicas: 4
    replica_devices: [0, 0, 0, 0]
