# Nemotron 3.5 ASR Streaming 0.6B, 2 replicas on one 24 GB RTX 4090 D under native MPS, measured with sglang-omni a385eac6: the most audio within a p99 request latency of 0.5, 1 and 3 s.
# sgl-omni serve --model-path nvidia/nemotron-3.5-asr-streaming-0.6b serves this config by default on an RTX 4090 D (see docs/basic_usage/mps_dp.md).

config_cls: Nemotron3_5ASRPipelineConfig
model_path: nvidia/nemotron-3.5-asr-streaming-0.6b
mps: 'on'
stages:
  asr:
    gpu: 0
    gpu_memory_fraction: 0.4648
    process: asr
    factory:
      max_batch_size: 16
      session_max_concurrency: 16
processes:
  asr:
    num_replicas: 2
    replica_devices: [0, 0]
