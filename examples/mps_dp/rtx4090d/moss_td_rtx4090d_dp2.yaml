# MOSS-Transcribe-Diarize, 2 replicas on one 24 GB RTX 4090 D under native MPS, measured with sglang-omni a385eac6: the most audio within a p99 request latency of 0.5 s.
# sgl-omni serve --model-path OpenMOSS-Team/MOSS-Transcribe-Diarize serves this config by default on an RTX 4090 D (see docs/basic_usage/mps_dp.md).

config_cls: MossTranscribeDiarizePipelineConfig
model_path: OpenMOSS-Team/MOSS-Transcribe-Diarize
mps: 'on'
stages:
  asr:
    gpu: 0
    gpu_memory_fraction: 0.2799
    process: asr
    engine:
      mem_fraction_static: 0.8008
      max_running_requests: 64
      cuda_graph_max_bs: 64
      max_total_tokens: 32768
processes:
  asr:
    num_replicas: 2
    replica_devices: [0, 0]
