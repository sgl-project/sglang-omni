# MOSS-TTS v1.5, 2 replicas on one 183 GB B200 under native MPS, measured with sglang-omni 8848e500: the most audio within a p99 stall-free start of 0.5 and 3 s.
# sgl-omni serve --model-path OpenMOSS-Team/MOSS-TTS-v1.5 serves this config by default on a B200 (see docs/basic_usage/mps_dp.md).

config_cls: MossTTSPipelineConfig
model_path: OpenMOSS-Team/MOSS-TTS-v1.5
mps: 'on'
stages:
  preprocessing:
    gpu: 0
    gpu_memory_fraction: 0.0222
  tts_engine:
    gpu: 0
    gpu_memory_fraction: 0.1201
    engine:
      mem_fraction_static: 0.1112
      max_running_requests: 16
      max_queued_requests: 16
      cuda_graph_max_bs: 32
      max_total_tokens: 16384
  vocoder:
    gpu: 0
    gpu_memory_fraction: 0.0534
    process: vocoder
processes:
  pipeline:
    num_replicas: 2
    replica_devices: [0, 0]
  vocoder:
    num_replicas: 2
    replica_devices: [0, 0]
