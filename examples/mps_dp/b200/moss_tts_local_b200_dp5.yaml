# MOSS-TTS Local Transformer v1.5, 5 replicas on one 183 GB B200 under native MPS, measured with sglang-omni 8848e500: the most audio within a p99 stall-free start of 0.5, 1 and 3 s.
# sgl-omni serve --model-path OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5 serves this config by default on a B200 (see docs/basic_usage/mps_dp.md).

config_cls: MossTTSLocalPipelineConfig
model_path: OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5
mps: 'on'
stages:
  tts_engine:
    gpu: 0
    gpu_memory_fraction: 0.1068
    engine:
      mem_fraction_static: 0.0979
      max_running_requests: 16
      max_queued_requests: 16
      cuda_graph_max_bs: 32
      max_total_tokens: 16384
      cuda_graph_backend_prefill: full
      prefill_attention_backend: flashinfer
  vocoder:
    gpu: 0
    gpu_memory_fraction: 0.0623
    process: vocoder
  preprocessing:
    gpu: 0
    gpu_memory_fraction: 0.0222
processes:
  pipeline:
    num_replicas: 5
    replica_devices: [0, 0, 0, 0, 0]
  vocoder:
    num_replicas: 5
    replica_devices: [0, 0, 0, 0, 0]
