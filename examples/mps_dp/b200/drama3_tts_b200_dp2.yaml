# SPDX-License-Identifier: Apache-2.0
# Fish Audio Drama 3, 2 replicas on one 183 GB B200 under native MPS: the most audio within a p99 stall-free start of 0.5, 1 and 3 s, measured with sglang-omni 8848e500 (see docs/basic_usage/mps_dp.md).
# Uses the default S2-Pro codec (fishaudio/s2-pro at 1de9996b), as measured.

config_cls: Drama3PipelineConfig
model_path: fishaudio/drama-3
stages:
  tts_engine:
    gpu: 0
    gpu_memory_fraction: 0.2891
    engine:
      max_running_requests: 16
      max_queued_requests: 16
      cuda_graph_max_bs: 32
  vocoder:
    gpu: 0
    gpu_memory_fraction: 0.0667
processes:
  preprocessing:
    num_replicas: 2
    replica_devices: [0, 0]
  pipeline:
    num_replicas: 2
    replica_devices: [0, 0]
