# Qwen3-TTS 1.7B Base, 6 replicas on one 141 GB H200 under native MPS, measured with sglang-omni a385eac6: 1.97x the model's own config at a p99 stall-free start of 0.5, 1 and 3 s.
# sgl-omni serve --model-path Qwen/Qwen3-TTS-12Hz-1.7B-Base serves this config by default on an H200 (see docs/basic_usage/mps_dp.md).

config_cls: Qwen3TTSPipelineConfig
model_path: Qwen/Qwen3-TTS-12Hz-1.7B-Base
mps: 'on'
stages:
  tts_engine:
    gpu: 0
    gpu_memory_fraction: 0.0851
    engine:
      mem_fraction_static: 0.8865
      max_running_requests: 16
      max_queued_requests: 16
      cuda_graph_max_bs: 32
      max_total_tokens: 32768
  vocoder:
    gpu: 0
    gpu_memory_fraction: 0.0227
    process: vocoder
processes:
  pipeline:
    num_replicas: 6
    replica_devices: [0, 0, 0, 0, 0, 0]
  vocoder:
    num_replicas: 6
    replica_devices: [0, 0, 0, 0, 0, 0]
