# MOSS-Transcribe-Diarize, 2 replicas on one 141 GB H200 under native MPS, each with the engine's own concurrency and the GPU's memory split evenly, measured with sglang-omni a385eac6: the most audio within a p99 request latency of 0.5, 1 and 3 s.
# sgl-omni serve --model-path OpenMOSS-Team/MOSS-Transcribe-Diarize serves this config by default on an H200 (see docs/basic_usage/mps_dp.md).

config_cls: MossTranscribeDiarizePipelineConfig
model_path: OpenMOSS-Team/MOSS-Transcribe-Diarize
mps: 'on'
stages:
  asr:
    gpu: 0
    gpu_memory_fraction: 0.46
    process: asr
    engine:
      mem_fraction_static: 0.966
      max_running_requests: 64
      max_total_tokens: 157670
processes:
  asr:
    num_replicas: 2
    replica_devices: [0, 0]
