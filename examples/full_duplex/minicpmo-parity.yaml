config_cls: MiniCPMODuplexPipelineConfig
model_path: /path/to/MiniCPM-o-4_5
reference_audio: null

max_sessions: 2
speech_state_bytes_per_session: 2147483648

sampling:
  greedy: true
  temperature: 0.7
  top_k: 100
  top_p: 0.8
  repetition_penalty: 1.05
  listen_prob_scale: 1.0
  force_listen_count: 3
  max_new_tokens_per_unit: 20
  repetition_window_size: 512
  talker_temperature: 0.8
  talker_repetition_penalty: 1.05

vision:
  max_frames_per_unit: 4
  max_tiles_per_unit: 10
  max_slice_nums: 1
  max_slice_nums_limit: 9

stages:
  perception:
    gpu_memory_fraction: 0.12
  thinker:
    gpu_memory_fraction: 0.52
    engine:
      disable_cuda_graph: true
  talker:
    gpu_memory_fraction: 0.15
    engine:
      disable_cuda_graph: true
  speech:
    gpu_memory_fraction: 0.15
