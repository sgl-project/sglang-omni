[build-system]
# >=77 supports the PEP 639 license fields and PEP 660 editable builds.
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

# Apple Silicon reference profile; not consumed by pip or install.sh.
# Use the root install.sh with SGLANG_OMNI_EXTRAS=mlx instead; see
# docs/get_started/installation.md#macos-apple-silicon.
# Do not replace the root pyproject.toml with this file.
# The macOS torch wheels already carry the Metal (MPS) backend, so no extra index is
# needed; what has to go is every CUDA-only wheel the main manifest pins
# (flashinfer, flash-attn-4, nixl-cu13, mooncake-cuda13).
# sglang cannot be pinned here for the same reason it is left out of the Intel XPU
# manifest: every published wheel pulls CUDA torch, which would replace the macOS
# build. Install it from a source checkout as the install guide describes.

[project]
name = "sglang-omni"
dynamic = ["version"]
description = "Multi-stage pipeline framework for omni models (Apple Silicon build)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- Core framework (device-agnostic) ----------------------------------
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
    "msgspec",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "httpx",
    "xxhash>=3.0.0",
    "pybase64>=1.4.0",       # fast base64 decode for inline media (utils/audio.py)
    "tabulate",
    "pandas",
    "typer>=0.9.0",

    # --- PyTorch (macOS arm64 wheels ship the MPS backend) ------------------
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",

    # --- Model loading / HF -------------------------------------------------
    "accelerate>=0.27.0",
    "transformers==5.12.1",        # Match the root manifest's SGLang 0.5.19 stack
    "safetensors>=0.4.3",
    "pillow>=10.0.0",
    "huggingface-hub>=0.36.0",
    "datasets>=2.14.0",

    # NOTE: sglang is intentionally NOT pinned here (see the header).

    # --- API server ---------------------------------------------------------
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    "websockets>=12.0",
    "openai==2.6.1",
    "openai-harmony==0.0.4",
    # /v1/realtime — server-side VAD (onnxruntime accepts any protobuf: no conflict)
    "silero-vad>=5.1",
    "onnxruntime>=1.17",

    # --- Multimodal preprocessing ------------------------------------------
    "qwen-vl-utils==0.0.11",
    "librosa>=0.11.0",
    "av>=16.1.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# Qwen3-Omni on Apple Silicon requires native MLX and SGLANG_USE_MLX=1.
# Torch remains necessary for CPU preprocessing and inter-stage transport.
mlx = [
    "mlx>=0.32.2",
    "mlx-lm>=0.31.2",
]
# WER / speaker-similarity eval + tests (device-agnostic).
eval = [
    "s3prl>=0.4.18",
    "jiwer",
    "openai-whisper==20250625",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
all = [
    "mlx>=0.32.2", "mlx-lm>=0.31.2",
    "s3prl>=0.4.18", "jiwer", "openai-whisper==20250625",
    "pytest>=7.0.0", "pytest-asyncio>=0.21.0",
]

[project.scripts]
sgl-omni = "sglang_omni.cli:app"
sgl-omni-router-py = "sglang_omni_router.python.serve:main"

[project.entry-points."sglang.serve_backends"]
omni = "sglang_omni.cli.sglang_backend:create_backend"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "benchmark: performance benchmark tests (may require GPU and long runtime)",
    "tts_stage(name): select an in-file TTS benchmark CI stage",
    "accelerator: requires accelerator hardware",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "sglang_omni",
    "sglang_omni.*",
    "sglang_omni_router.python",
    "sglang_omni_router.python.*",
]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "sglang_omni.__version__"}

[tool.setuptools.package-data]
"sglang_omni.models.fishaudio_s2_pro" = ["fish_speech/configs/*.yaml"]
"sglang_omni.models.higgs_tts" = ["configs/*.json"]
