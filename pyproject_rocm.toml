[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-omni"
dynamic = ["version"]
description = "Multi-stage pipeline framework for omni models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"

# The ROCm image supplies the mutually coupled torch, torchvision, torchaudio,
# SGLang, AITER, Triton, RCCL, and NIXL/UCX stack. Keep them out of this manifest:
# resolving any published CUDA wheel here can silently replace the HIP build.
dependencies = [
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
    "msgspec",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pybase64>=1.4.0",
    "accelerate>=0.27.0",
    "transformers==5.12.1",
    "safetensors>=0.4.3",
    "pillow>=10.0.0",
    "huggingface-hub[hf_xet]>=0.36.0",
    "datasets>=2.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    "cache-dit==1.3.0",
    "addict==2.4.0",
    "imageio==2.36.0",
    "imageio-ffmpeg==0.5.1",
    "logger",
    "httpx",
    "xxhash>=3.0.0",
    "sox>=1.4.1",
    "av>=16.1.0",
    "qwen-vl-utils==0.0.11",
    "numba==0.65.1",
    "librosa>=0.11.0",
    "pandas",
    "tabulate",
    "typer>=0.9.0",
    "openai==2.6.1",
    "openai-harmony==0.0.4",
    "soundfile>=0.12.0",
    "mistral_common[audio]>=1.11.0",
    "silero-vad>=5.1",
    "onnxruntime>=1.17",
    "websockets>=12.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "jiwer",
    "zhon>=2.0.2",
    "scipy>=1.10.0",
    "openai-whisper==20250625",
    "s3prl>=0.4.18",
    "tiktoken",
    "hydra-core",
    "omegaconf",
    "gradio>=4.0.0",
    "dots.tts==0.2.1",
    "diffusers==0.37.0",
    "x-transformers",
    "nemo_text_processing==1.2.0",
]

[project.optional-dependencies]
audar-tts = [
    "llama-cpp-python==0.3.34",
    "neucodec==0.0.6",
]

[project.scripts]
sgl-omni = "sglang_omni.cli:app"
sgl-omni-router = "sglang_omni_router.serve:main"

[project.urls]
Documentation = "https://sgl-project.github.io/sglang-omni/"
Issues = "https://github.com/sgl-project/sglang-omni/issues"
Repository = "https://github.com/sgl-project/sglang-omni"

[tool.uv]
override-dependencies = ["protobuf>=6.31.1,<7.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "benchmark: performance benchmark tests (may require GPU and long runtime)",
    "tts_stage(name): select an in-file TTS benchmark CI stage",
    "gpu: requires a CUDA-compatible accelerator (auto-skipped without one)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sglang_omni*"]

[tool.setuptools.dynamic]
version = {attr = "sglang_omni.__version__"}

[tool.setuptools.package-data]
"sglang_omni.models.fishaudio_s2_pro" = ["fish_speech/configs/*.yaml"]
"sglang_omni.models.higgs_tts" = ["configs/*.json"]
"sglang_omni.models.zonos2" = ["moe_configs/*/*.json"]
