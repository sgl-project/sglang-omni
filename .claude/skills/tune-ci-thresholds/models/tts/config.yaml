# Model-specific config for the TTS CI threshold skill.
#
# Notes:
# - test_tts_ci.py runs two generation/WER modes: nonstream and stream.
#   The GitHub workflow runs them as separate stages, but tune.py may run the
#   full file once per repeat and then extract both variants from their JSONs.
# - TTS speed and WER artifacts are written under per-mode output dirs:
#   tts_nonstream_c16/ and tts_stream_c16/. Both speed_results.json and
#   wer_results.json live in that same per-mode dir.
# - Concurrency: CI uses TTS_CONCURRENCY = 16. Discover reads the conc=16 row.
# - Venv: CI uses omni-tts under OMNI_CI_HOME (see omni_ci_home below).
# - Auth: export HF_TOKEN before precheck/run unless the private TTS model
#   weights are already present in the configured HF cache.
name: tts
description: "TTS CI"
hf_model_id: "boson-sglang/higgs-audio-v3-tts-4b-base"
hf_datasets:
  - "zhaochenyang20/seed-tts-eval-arrow"
omni_ci_home: "/github/home/calibration/tts"
default_venv_python:
  - "/sgl-workspace/sglang-omni/omni-tts/bin/python"
  - "/github/home/calibration/tts/omni-tts/bin/python"
  - "/github/home/omni-tts/bin/python"
expected_wer_normalizer: "english"
auto_env:
  HOME: "/github/home"
  OMNI_CI_HOME: "/github/home/calibration/tts"
  HF_HOME: "/github/home/.cache/huggingface"
  MODELSCOPE_CACHE: "/github/home/.cache/modelscope"
  XDG_CACHE_HOME: "/github/home/calibration/tts/.cache"
  HF_ENDPOINT: "https://hf-mirror.com"
  HF_HUB_DISABLE_XET: "1"
  UV_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  UV_CACHE_DIR: "/github/home/.cache/uv"
  TORCHINDUCTOR_CACHE_DIR: "/github/home/calibration/tts/.torchinductor"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
# TTS CI runs one managed router plus two one-GPU workers.
gpus_per_test:
  test_tts_ci.py: 2
test_globs:
  - "tests/test_model/test_tts_ci.py"
extra_env: {}
stage_base_strip_prefix: "test_"
stage_base_strip_suffix: "_ci"
stage_base_docs_override: "tts_docs"
metric_sources:
  test_tts_ci.py:
    # Per-variant routing: both variants share the partitioned WER constants,
    # while each mode owns its speed reference dictionary.
    variants:
      nonstream:
        constant_filter: "^TTS_NON_STREAM.*|^TTS_WER_.*"
        json_file: "test_tts_non_streaming_generat0/tts_nonstream_c16/speed_results.json"
        sample_counts:
          total: "test_tts_non_streaming_generat0/tts_nonstream_c16/wer_results.json::summary.total_samples"
          ok: "test_tts_non_streaming_generat0/tts_nonstream_c16/wer_results.json::summary.evaluated"
        paths:
          throughput_qps: "summary.throughput_qps"
          output_tok_per_req_s: "summary.output_tok_per_req_s"
          latency_mean_s: "summary.latency_mean_s"
          rtf_mean: "summary.rtf_mean"
          wer_below_50_corpus: "test_tts_non_streaming_generat0/tts_nonstream_c16/wer_results.json::summary.wer_below_50_corpus"
          n_above_50: "test_tts_non_streaming_generat0/tts_nonstream_c16/wer_results.json::summary.n_above_50_pct_wer"
      stream:
        constant_filter: "^TTS_STREAM.*|^TTS_WER_.*"
        json_file: "test_tts_streaming_generation0/tts_stream_c16/speed_results.json"
        sample_counts:
          total: "test_tts_streaming_generation0/tts_stream_c16/wer_results.json::summary.total_samples"
          ok: "test_tts_streaming_generation0/tts_stream_c16/wer_results.json::summary.evaluated"
        paths:
          throughput_qps: "summary.throughput_qps"
          output_tok_per_req_s: "summary.output_tok_per_req_s"
          latency_mean_s: "summary.latency_mean_s"
          rtf_mean: "summary.rtf_mean"
          wer_below_50_corpus: "test_tts_streaming_generation0/tts_stream_c16/wer_results.json::summary.wer_below_50_corpus"
          n_above_50: "test_tts_streaming_generation0/tts_stream_c16/wer_results.json::summary.n_above_50_pct_wer"
