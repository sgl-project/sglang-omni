name: Lint

# Runs on every pull request without CI labels, and is a required check on
# main. The self-hosted CI gates (.github/scripts/pr_ci_gate.py) wait for the
# lint job on the same commit, so keep this workflow fast. Pushes to main only
# refresh the pre-commit cache that pull requests read.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      # note (chenyang): no-commit-to-branch fails on main by design, so a
      # push only builds the hook environments for the cache.
      - name: Warm pre-commit cache
        if: ${{ github.event_name == 'push' }}
        run: pre-commit install-hooks

      - name: Linting
        if: ${{ github.event_name != 'push' }}
        run: pre-commit run --all-files --show-diff-on-failure

  playback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test realtime playback state
        run: node --test playground/qwen-omni/realtime/playback.test.js

      - name: Test realtime demo heard text
        run: node --test playground/cascade/frontend/orb/session.test.mjs

      - name: Test native realtime playback cadence and lifecycle
        run: node --test playground/realtime/frontend/orb/*.test.mjs
