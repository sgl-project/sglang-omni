name: Docs Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # A pull request that changes only the MLX path is tested by Mac CI and Voxt CI.
    paths-ignore:
      - "sglang_omni_mlx/**"
      - "Voxt/**"
      - ".github/workflows/mac-ci.yaml"
      - ".github/workflows/voxt*.yaml"
  workflow_dispatch:

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Note (Akazaakane): The third-party Chrome repo is unnecessary for docs builds.
          sudo find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -qE 'https?://dl\.google\.com/linux/chrome(-stable)?/deb([/[:space:]]|$)' {} \; \
            -delete

          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get install -y --no-install-recommends pandoc parallel retry
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          make compile
          make html

      # Docs Preview (docs-preview.yaml) deploys this build to
      # https://sgl-project.github.io/sglang-omni/pr-preview/pr-<number>/ for
      # a qualifying pull request, with a rendered diff against the base under
      # _diff/ so reviewers read only what changed.
      - name: Build the base documentation for the rendered diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base/docs"
          make compile
          make html

      - name: Diff the rendered pages against the base
        if: github.event_name == 'pull_request'
        run: |
          python .github/scripts/docs_diff.py \
            "$RUNNER_TEMP/base/docs/_build/html" docs/_build/html docs/_build/html/_diff

      - name: Upload the built documentation
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
          if-no-files-found: error

  doc-style-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation lint dependencies
        run: python -m pip install -r scripts/requirements-doc-lint.txt pytest

      - name: Test documentation style checker
        run: python -m pytest tests/unit_test/scripts/test_check_doc_style*.py tests/unit_test/scripts/test_docs_diff.py -q
