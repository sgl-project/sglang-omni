name: Voxt Release

# Builds Voxt (Voxt/: Go on MyGo, with the Swift helper and the Omni runtime
# inside) with scripts/release.sh for a voxt-vX.Y.Z tag, which
# sets the version (newer than every voxt-v tag): signed with the Developer
# ID of the voxt-release environment, notarized, checked by
# scripts/release-verify.sh, and uploaded with the app's ZIP (for Voxt 1.x's
# in-app update and Homebrew, voxt-appcast.yaml) and their SHA-256 to a draft
# release whose notes are the version's section of Voxt/CHANGELOG.md. Apple
# silicon only. The nightly from main (voxt-nightly.yaml, version
# X.Y.Z-nightly.YYYYMMDD) and the beta of each Voxt change merged into main
# (voxt-beta.yaml, version X.Y.Z-beta.YYYYMMDD.N with Z one past mygo.json's
# patch), or either run by hand from any branch, are signed and notarized
# the same way and keep their disk image and its SHA-256 as an artifact,
# without the ZIP, which only a release's update uses. A beta from main is
# also a prerelease voxt-vX.Y.Z-beta.YYYYMMDD.N with them, the last five
# kept, which the app's Beta updates offers. A beta takes the Omni runtime from the cache when
# one was built from the same sources. Any other run (a pull request that
# changes the release, or this workflow by hand) builds the same app ad
# hoc, unsigned, and keeps its disk image the same way.

on:
  push:
    tags: ["voxt-v*"]
  pull_request:
    paths:
      - ".github/workflows/voxt-release.yaml"
      - "Voxt/scripts/release*.sh"
      - "Voxt/scripts/build-*.sh"
  workflow_dispatch:
  workflow_call:
    inputs:
      nightly:
        description: Set the version to X.Y.Z-nightly.YYYYMMDD, and from main or run by hand sign and notarize it
        type: boolean
        default: false
      beta:
        description: Set the version to X.Y.Z-beta.YYYYMMDD.N (N the caller's run number), take the Omni runtime from the cache, and from main or run by hand sign and notarize it
        type: boolean
        default: false

# The calling workflow's name keeps a nightly and a release run of one pull request from cancelling each other.
concurrency:
  group: voxt-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    name: Voxt release package
    runs-on: macos-26
    timeout-minutes: 150
    # A release, or a nightly or a beta from main or run by hand. A run by hand from a branch the environment does not let in fails here.
    environment: ${{ (startsWith(github.ref, 'refs/tags/voxt-v') || ((inputs.nightly == true || inputs.beta == true) && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'))) && 'voxt-release' || '' }}
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/voxt-v') }}
      IS_NIGHTLY: ${{ inputs.nightly == true }}
      IS_BETA: ${{ inputs.beta == true }}
      IS_SIGNED: ${{ startsWith(github.ref, 'refs/tags/voxt-v') || ((inputs.nightly == true || inputs.beta == true) && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')) }}
      # A beta's Omni runtime (RUNTIMES/omni), built or from the cache, for scripts/release.sh --runtimes.
      RUNTIMES: ${{ github.workspace }}/Voxt/build/runtimes
      # The team of the voxt-release environment's Developer ID, as for the Swift Voxt 1.x.
      TEAM_ID: RY2TQTYSKQ
      GIT_TERMINAL_PROMPT: "0"
    defaults:
      run:
        working-directory: Voxt
    steps:
      - uses: actions/checkout@v4
        with:
          # A release compares its tag with every voxt-v tag.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/voxt-v') && '0' || '1' }}
          # The build runs third-party code, and only the draft release needs the write token.
          persist-credentials: false

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="${GITHUB_REF_NAME#voxt-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The tag must be voxt-vX.Y.Z, got $GITHUB_REF_NAME"
              exit 1
            else
              :
            fi
            # Versions only go up: newer than every other voxt-v tag, so that a failed tag can be pushed again.
            newest="$(git tag --list 'voxt-v*' | grep -vxF "$GITHUB_REF_NAME" | sed 's/^voxt-v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
            highest="$(printf '%s\n%s\n' "$newest" "$version" | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
            if [[ "$highest" != "$version" || "$version" == "$newest" ]]; then
              echo "::error::$GITHUB_REF_NAME must be newer than voxt-v$newest"
              exit 1
            else
              :
            fi
          elif [[ "$IS_NIGHTLY" == "true" ]]; then
            version="$(jq -r .version mygo.json)-nightly.$(date -u +%Y%m%d)"
          elif [[ "$IS_BETA" == "true" ]]; then
            # A beta previews the next patch: after release X.Y.Z, X.Y.Z-beta would sort before it and the app's check would never offer it. The run number tells apart the betas of one day.
            IFS=. read -r major minor patch <<< "$(jq -r .version mygo.json)"
            version="$major.$minor.$((patch + 1))-beta.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          else
            version="$(jq -r .version mygo.json)"
          fi
          # A tag, a nightly or a beta sets the version of the app and the helper, which scripts/release.sh checks agree.
          if [[ "$IS_RELEASE" == "true" || "$IS_NIGHTLY" == "true" || "$IS_BETA" == "true" ]]; then
            jq --arg v "$version" '.version = $v' mygo.json > mygo.json.tmp
            mv mygo.json.tmp mygo.json
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" helper/Support/Info.plist
          else
            :
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Voxt $version, release: $IS_RELEASE"

      - uses: actions/setup-go@v5
        with:
          go-version-file: Voxt/go.mod
          cache-dependency-path: Voxt/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Import the signing identity
        if: env.IS_SIGNED == 'true'
        env:
          DEVELOPER_ID_APP_CERT_P12: ${{ secrets.DEVELOPER_ID_APP_CERT_P12 }}
          DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/voxt-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$DEVELOPER_ID_APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$DEVELOPER_ID_APP_CERT_PASSWORD" \
            -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r keychain_path; do
            search_list+=("$keychain_path")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          security list-keychains -d user -s "${search_list[@]}"
          # Fails unless the certificate is a valid Developer ID Application of TEAM_ID.
          identity="$(scripts/release-identity.sh "$TEAM_ID" "$keychain" | cut -f1)"
          echo "VOXTNEW_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials voxt-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" --issuer "$APPLE_NOTARIZATION_ISSUER" --keychain "$keychain"

      # The Omni runtime's cache key names the Xcode it was built with: a new
      # one on the runner builds it again.
      - name: Key the Omni runtime's cache
        id: runtimes
        if: env.IS_BETA == 'true'
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The staged Omni runtime does not depend on the app's version or
      # identity (build-omni.sh signs it ad hoc; mygo build signs the app's
      # copy), so a cached one for the same sources is the same.
      - name: Restore the Omni runtime
        id: omni-cache
        if: env.IS_BETA == 'true'
        uses: actions/cache@v4
        with:
          path: Voxt/build/runtimes/omni
          key: voxt-omni-${{ steps.runtimes.outputs.xcode }}-${{ hashFiles('sglang_omni_mlx/native/**', 'Voxt/scripts/build-omni.sh') }}

      - name: Build the Omni runtime
        if: env.IS_BETA == 'true' && steps.omni-cache.outputs.cache-hit != 'true'
        run: scripts/build-omni.sh --out "$RUNTIMES/omni" --clean

      - name: Build, sign, notarize and check
        env:
          # Reads hehehai/actnow-sounds, the sound library of official builds;
          # without it the app plays macOS's system sounds.
          ACTNOW_SOUNDS_TOKEN: ${{ secrets.ACTNOW_SOUNDS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${ACTNOW_SOUNDS_TOKEN:-}" ]]; then
            auth="$(printf 'x-access-token:%s' "$ACTNOW_SOUNDS_TOKEN" | base64)"
            git -c http.extraheader="Authorization: Basic $auth" \
              clone --depth 1 https://github.com/hehehai/actnow-sounds "$RUNNER_TEMP/actnow-sounds"
            export ACTNOW_SOUNDS="$RUNNER_TEMP/actnow-sounds"
          else
            echo "::warning::No ACTNOW_SOUNDS_TOKEN: this build has no sound library and plays macOS's system sounds"
          fi
          args=()
          if [[ "$IS_SIGNED" == "true" ]]; then
            args+=(--notarize voxt-notary --keychain "$RELEASE_KEYCHAIN")
            export EXPECT_TEAM="$TEAM_ID"
          else
            :
          fi
          if [[ "$IS_BETA" == "true" ]]; then
            args+=(--runtimes "$RUNTIMES")
          else
            :
          fi
          scripts/release.sh ${args[@]+"${args[@]}"}

      - name: Remove the signing identity
        if: always() && env.IS_SIGNED == 'true'
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          else
            :
          fi
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Collect the disk image, and a release's ZIP
        run: |
          set -euo pipefail
          dmg="$(compgen -G 'build/darwin-arm64/*.dmg' | head -1 || true)"
          if [[ -z "$dmg" ]]; then
            echo "::error::No disk image in Voxt/build/darwin-arm64"
            exit 1
          else
            :
          fi
          # What Voxt 1.x's Sparkle checks before it installs the ZIP's app (scripts/release.sh writes it).
          want="$(scripts/release-appcast.sh info-plist "$VERSION" | jq -c .)"
          got="$(plutil -convert json -o - build/darwin-arm64/Voxt.app/Contents/Info.plist | jq -c '{CFBundleVersion, SUPublicEDKey}')"
          if [[ "$got" != "$want" ]]; then
            echo "::error::Voxt.app's Info.plist has $got, Voxt 1.x's update needs $want"
            exit 1
          else
            :
          fi
          out="$RUNNER_TEMP/artifacts"
          read -r zip_name name <<< "$(scripts/release-appcast.sh assets "$VERSION")"
          mkdir -p "$out"
          cp "$dmg" "$out/$name"
          # The SHA-256 files name the artifacts, not local paths, so shasum -c works after a download.
          (cd "$out" && shasum -a 256 "$name" > "$name.sha256")
          if [[ "$IS_RELEASE" == "true" ]]; then
            # Voxt 1.x's in-app update and the Homebrew cask install the app from the release's ZIP (voxt-appcast.yaml), as Voxt 1.x's release made it.
            ditto -c -k --sequesterRsrc --keepParent build/darwin-arm64/Voxt.app "$out/$zip_name"
            (cd "$out" && shasum -a 256 "$zip_name" > "$zip_name.sha256")
          else
            :
          fi
          echo "ARTIFACTS_DIR=$out" >> "$GITHUB_ENV"
          ls -l "$out"

      - name: Keep the disk image
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Voxt-${{ env.VERSION }}-arm64${{ env.IS_SIGNED != 'true' && '-unsigned' || '' }}
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 14

      # Beta updates in the app (updates_github.go) offers the newest of these prereleases; never the latest release, and only the last few kept.
      - name: Publish the beta as a prerelease
        if: env.IS_BETA == 'true' && env.IS_SIGNED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_BETAS: 5
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/beta-notes.md"
          section="$(awk '/^## /{f = index($0, "[Unreleased]") > 0; next} f' CHANGELOG.md)"
          cat > "$notes" <<NOTES
          A beta of Voxt built from main at $GITHUB_SHA after each merged change. Open Voxt-$VERSION-arm64.dmg and drag Voxt to Applications. Betas are not tested as releases are.

          $section
          NOTES
          gh release create "voxt-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Voxt v$VERSION" --notes-file "$notes" "$ARTIFACTS_DIR"/*
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^voxt-v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]{8}\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[env.KEEP_BETAS | tonumber:][] | .tagName' \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done

      - name: Create the draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          # The version's section of CHANGELOG.md, else Unreleased (a tag on a commit that did not name the version).
          section="$(awk -v v="$VERSION" '/^## /{f = index($0, "[" v "]") || $2 == v; next} f' CHANGELOG.md)"
          if [[ ! "$section" =~ [^[:space:]] ]]; then
            section="$(awk '/^## /{f = index($0, "[Unreleased]") > 0; next} f' CHANGELOG.md)"
          else
            :
          fi
          cat > "$notes" <<NOTES
          ### Requirements

          - A Mac with Apple silicon and macOS 15 or later.

          ### Install

          - Open Voxt-$VERSION-arm64.dmg and drag Voxt to Applications. It replaces Voxt 1.x there.
          - This version does not update itself: install a newer one the same way.

          $section

          ### Build

          - Built from $GITHUB_SHA by the Voxt Release workflow. Signed with Developer ID and notarized by Apple. The SHA-256 checksum is attached.
          NOTES
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --latest \
            --title "Voxt v$VERSION" --notes-file "$notes" "$ARTIFACTS_DIR"/*
