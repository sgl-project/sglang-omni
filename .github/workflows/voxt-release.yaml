name: Voxt Release

# Builds Voxt (Voxt/: Go on MyGo, with the Swift helper, the Omni runtime and
# voxtnew-llm inside) with scripts/release.sh for a voxt-vX.Y.Z tag, which
# sets the version (newer than every voxt-v tag): signed with the Developer
# ID of the voxt-release environment, notarized, checked by
# scripts/release-verify.sh, and uploaded with its SHA-256 to a draft release
# whose notes are the version's section of Voxt/CHANGELOG.md. Apple silicon
# only. A run without a tag (a pull request that changes the release, or by
# hand) builds the same app ad hoc, unsigned, and keeps its disk image as an
# artifact.

on:
  push:
    tags: ["voxt-v*"]
  pull_request:
    paths:
      - ".github/workflows/voxt-release.yaml"
      - "Voxt/scripts/release*.sh"
      - "Voxt/scripts/build-*.sh"
  workflow_dispatch:

concurrency:
  group: voxt-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    name: Voxt release package
    runs-on: macos-26
    timeout-minutes: 150
    environment: ${{ startsWith(github.ref, 'refs/tags/voxt-v') && 'voxt-release' || '' }}
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/voxt-v') }}
      # The team of the voxt-release environment's Developer ID, as for the Swift Voxt 1.x.
      TEAM_ID: RY2TQTYSKQ
      GIT_TERMINAL_PROMPT: "0"
    defaults:
      run:
        working-directory: Voxt
    steps:
      - uses: actions/checkout@v4
        with:
          # A release compares its tag with every voxt-v tag.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/voxt-v') && '0' || '1' }}

      - name: Resolve the version
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="${GITHUB_REF_NAME#voxt-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The tag must be voxt-vX.Y.Z, got $GITHUB_REF_NAME"
              exit 1
            else
              :
            fi
            # Versions only go up: newer than every other voxt-v tag, so that a failed tag can be pushed again.
            newest="$(git tag --list 'voxt-v*' | grep -vxF "$GITHUB_REF_NAME" | sed 's/^voxt-v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
            highest="$(printf '%s\n%s\n' "$newest" "$version" | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
            if [[ "$highest" != "$version" || "$version" == "$newest" ]]; then
              echo "::error::$GITHUB_REF_NAME must be newer than voxt-v$newest"
              exit 1
            else
              :
            fi
            # The tag sets the version of the app, the helper and voxtnew-llm, which scripts/release.sh checks agree.
            jq --arg v "$version" '.version = $v' mygo.json > mygo.json.tmp
            mv mygo.json.tmp mygo.json
            for plist in helper/Support/Info.plist llm/Support/Info.plist; do
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
            done
          else
            version="$(jq -r .version mygo.json)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Voxt $version, release: $IS_RELEASE"

      - uses: actions/setup-go@v5
        with:
          go-version-file: Voxt/go.mod
          cache-dependency-path: Voxt/go.sum

      - uses: astral-sh/setup-uv@v6

      # Since Xcode 26 the Metal compiler is a separate component, which
      # mlx-swift needs to build its kernels (voxtnew-llm).
      - name: Install the Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          if xcrun metal --version > /dev/null 2>&1; then
            :
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Import the signing identity
        if: env.IS_RELEASE == 'true'
        env:
          DEVELOPER_ID_APP_CERT_P12: ${{ secrets.DEVELOPER_ID_APP_CERT_P12 }}
          DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/voxt-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$DEVELOPER_ID_APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$DEVELOPER_ID_APP_CERT_PASSWORD" \
            -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r keychain_path; do
            search_list+=("$keychain_path")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          security list-keychains -d user -s "${search_list[@]}"
          # Fails unless the certificate is a valid Developer ID Application of TEAM_ID.
          identity="$(scripts/release-identity.sh "$TEAM_ID" "$keychain" | cut -f1)"
          echo "VOXTNEW_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials voxt-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" --issuer "$APPLE_NOTARIZATION_ISSUER" --keychain "$keychain"

      - name: Build, sign, notarize and check
        env:
          # Reads hehehai/actnow-sounds, the sound library of official builds;
          # without it the app plays macOS's system sounds.
          ACTNOW_SOUNDS_TOKEN: ${{ secrets.ACTNOW_SOUNDS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${ACTNOW_SOUNDS_TOKEN:-}" ]]; then
            auth="$(printf 'x-access-token:%s' "$ACTNOW_SOUNDS_TOKEN" | base64)"
            git -c http.extraheader="Authorization: Basic $auth" \
              clone -q --depth 1 https://github.com/hehehai/actnow-sounds "$RUNNER_TEMP/actnow-sounds"
            export ACTNOW_SOUNDS="$RUNNER_TEMP/actnow-sounds"
          else
            echo "::warning::No ACTNOW_SOUNDS_TOKEN: this build has no sound library and plays macOS's system sounds"
          fi
          args=()
          if [[ "$IS_RELEASE" == "true" ]]; then
            args+=(--notarize voxt-notary --keychain "$RELEASE_KEYCHAIN")
            export EXPECT_TEAM="$TEAM_ID"
          else
            :
          fi
          scripts/release.sh ${args[@]+"${args[@]}"}

      - name: Remove the signing identity
        if: always() && env.IS_RELEASE == 'true'
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          else
            :
          fi
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Collect the disk image
        run: |
          set -euo pipefail
          dmg="$(compgen -G 'build/darwin-arm64/*.dmg' | head -1 || true)"
          if [[ -z "$dmg" ]]; then
            echo "::error::No disk image in Voxt/build/darwin-arm64"
            exit 1
          else
            :
          fi
          out="$RUNNER_TEMP/artifacts"
          name="Voxt-$VERSION-arm64.dmg"
          mkdir -p "$out"
          cp "$dmg" "$out/$name"
          # The SHA-256 file names the artifact, not a local path, so shasum -c works after a download.
          (cd "$out" && shasum -a 256 "$name" > "$name.sha256")
          echo "ARTIFACTS_DIR=$out" >> "$GITHUB_ENV"
          ls -l "$out"

      - name: Keep the unsigned disk image
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Voxt-${{ env.VERSION }}-arm64-unsigned
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 14

      - name: Create the draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          # The version's section of CHANGELOG.md, else Unreleased (a tag on a commit that did not name the version).
          section="$(awk -v v="$VERSION" '/^## /{f = index($0, "[" v "]") || $2 == v; next} f' CHANGELOG.md)"
          if [[ -z "${section//[[:space:]]/}" ]]; then
            section="$(awk '/^## /{f = index($0, "[Unreleased]") > 0; next} f' CHANGELOG.md)"
          else
            :
          fi
          cat > "$notes" <<NOTES
          ### Requirements

          - A Mac with Apple silicon and macOS 15 or later.

          ### Install

          - Open Voxt-$VERSION-arm64.dmg and drag Voxt to Applications. It replaces Voxt 1.x there.
          - This version does not update itself: install a newer one the same way.

          $section

          ### Build

          - Built from $GITHUB_SHA by the Voxt Release workflow. Signed with Developer ID and notarized by Apple. The SHA-256 checksum is attached.
          NOTES
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --latest \
            --title "Voxt v$VERSION" --notes-file "$notes" "$ARTIFACTS_DIR"/*
