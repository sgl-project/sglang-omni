name: Authorize self-hosted CI

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sgl-project/sglang-omni
          ref: refs/heads/main
          sparse-checkout: |
            .github/scripts
            .github/workflows
          persist-credentials: false
      - name: Verify caller, current head and approval
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TRUSTED_USER_IDS: ${{ vars.SELF_HOSTED_CI_TRUSTED_USER_IDS }}
        with:
          script: |
            const authorize = require('./.github/scripts/authorize-self-hosted.cjs');
            await authorize(github, context, process.env);
