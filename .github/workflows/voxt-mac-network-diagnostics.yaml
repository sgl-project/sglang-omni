name: Voxt Mac network diagnostics

# Temporary: how the Apple Silicon runner reaches the hosts Voxt Mac CI
# downloads from. It prints no proxy host other than a loopback one and no
# address of the runner itself; it does print each CDN's edge location code.

on:
  pull_request:
    paths:
      - ".github/workflows/voxt-mac-network-diagnostics.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_FILE: mlx-community/Qwen3-ASR-1.7B-8bit/resolve/a8379a2e2f9e313c9292cdf1af4055ab56d50d55/model.safetensors
  # The same file: ModelScope mirrors mlx-community with matching SHA-256.
  MODELSCOPE_FILE: mlx-community/Qwen3-ASR-1.7B-8bit/resolve/master/model.safetensors

jobs:
  network:
    name: runner network diagnostics
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Runner, power and process
        run: |
          echo "${RUNNER_NAME}: $(sysctl -n machdep.cpu.brand_string), macOS $(sw_vers -productVersion), user $(id -un)"
          pmset -g batt | head -2 || true
          pmset -g | grep -E 'lowpowermode|powermode| sleep |displaysleep' || true
          ps -o pid,ppid,pri,ni,stat,comm -p $$ -p $PPID
          for plist in "$HOME"/Library/LaunchAgents/actions.runner.*.plist /Library/LaunchDaemons/actions.runner.*.plist; do
            if [ -f "$plist" ]; then
              echo "$plist: ProcessType=$(/usr/libexec/PlistBuddy -c 'Print :ProcessType' "$plist" 2>/dev/null || echo unset)"
            else
              :
            fi
          done

      - name: Proxies the runner sees
        run: |
          env | grep -iE '^(https?|all|no)_proxy=' | sed -E 's/=.*/=<set>/' || echo "no proxy variables"
          scutil --proxy | grep -E 'Enable|ExceptionsList' || true
          python3 - <<'EOF'
          import urllib.request
          from urllib.parse import urlsplit

          proxies = urllib.request.getproxies()
          print("python sees proxies:", "none" if not proxies else "")
          for scheme, url in proxies.items():
              host = urlsplit(url if "://" in url else f"http://{url}").hostname
              print(f"  {scheme} -> {host if host in ('127.0.0.1', 'localhost', '::1') else 'non-local proxy'}")
          EOF

      - name: Download speed by host
        run: |
          # Each probe reads at most 200 MB for at most 20 s.
          probe() {
            label="$1"; shift
            curl -sS -L --max-time 20 -o /dev/null \
              -w "%{http_code} %{size_download} %{speed_download} %{time_connect} %{time_appconnect} %{time_starttransfer} %{num_redirects}\n" "$@" 2>/dev/null |
              awk -v label="$label" '{printf "%-34s http %s  %6.1f MB/s  %5.0f MB  connect %.2fs  tls %.2fs  first byte %.2fs  redirects %s\n", label, $1, $3 / 1e6, $2 / 1e6, $4, $5, $6, $7}'
          }
          edge() {
            curl -sS -L -I -r 0-0 --max-time 15 "$1" 2>/dev/null | grep -iE '^(x-amz-cf-pop|cf-ray|via|server):' | tr -d '\r' | sed 's/^/    /' | sort -u
          }
          range=(-r 0-199999999)
          probe "huggingface.co" "${range[@]}" "https://huggingface.co/$HF_FILE"
          edge "https://huggingface.co/$HF_FILE"
          probe "huggingface.co, IPv4 only" -4 "${range[@]}" "https://huggingface.co/$HF_FILE"
          probe "hf-mirror.com" "${range[@]}" "https://hf-mirror.com/$HF_FILE"
          probe "modelscope.cn" "${range[@]}" "https://www.modelscope.cn/models/$MODELSCOPE_FILE"
          edge "https://www.modelscope.cn/models/$MODELSCOPE_FILE"
          probe "openslr.org" "${range[@]}" "https://www.openslr.org/resources/12/test-clean.tar.gz"
          probe "github.com release asset" "${range[@]}" "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/LLVM-19.1.0-macOS-ARM64.tar.xz"
          # Note (XXXXRT666): the endpoint answers 403 from 100 MB up.
          probe "speed.cloudflare.com" "https://speed.cloudflare.com/__down?bytes=50000000"
          edge "https://speed.cloudflare.com/__down?bytes=1000"

      - name: Link capacity (networkQuality)
        run: |
          networkQuality -c -M 40 > "$RUNNER_TEMP/network-quality.json"
          python3 - "$RUNNER_TEMP/network-quality.json" <<'EOF'
          import json, sys

          result = json.load(open(sys.argv[1]))
          print(f"interface {result.get('interface_name')}: download {result['dl_throughput'] / 1e6:.0f} Mbps ({result['dl_throughput'] / 8e6:.1f} MB/s), upload {result['ul_throughput'] / 1e6:.0f} Mbps, base RTT {result.get('base_rtt', 0):.0f} ms, responsiveness {result.get('responsiveness', 0):.0f} RPM")
          EOF

      - name: One connection against four
        run: |
          # The same 200 MB of the Hugging Face file, as one range or as four ranges at once.
          url="https://huggingface.co/$HF_FILE"
          start=$(python3 -c 'import time; print(time.time())')
          for part in 0 1 2 3; do
            curl -sS -L -r "$((part * 50000000))-$((part * 50000000 + 49999999))" --max-time 20 -o /dev/null -w "%{size_download}\n" "$url" > "$RUNNER_TEMP/part-$part" 2>/dev/null &
          done
          wait
          python3 - "$start" "$RUNNER_TEMP" <<'EOF'
          import sys, time
          from pathlib import Path

          elapsed_seconds = time.time() - float(sys.argv[1])
          total_bytes = sum(int(Path(sys.argv[2], f"part-{part}").read_text() or 0) for part in range(4))
          print(f"four connections: {total_bytes / 1e6:.0f} MB in {elapsed_seconds:.1f} s = {total_bytes / 1e6 / elapsed_seconds:.1f} MB/s")
          EOF

      - name: Python urllib, as provision.py used to download
        run: |
          python3 - "https://huggingface.co/$HF_FILE" <<'EOF'
          import sys, time, urllib.request

          request = urllib.request.Request(sys.argv[1], headers={"Range": "bytes=0-199999999"})
          start_seconds = time.monotonic()
          read_bytes = 0
          with urllib.request.urlopen(request, timeout=30) as response:
              while time.monotonic() - start_seconds < 20:
                  chunk = response.read(1 << 20)
                  if chunk:
                      read_bytes += len(chunk)
                  else:
                      break
          elapsed_seconds = time.monotonic() - start_seconds
          print(f"urllib: {read_bytes / 1e6:.0f} MB in {elapsed_seconds:.1f} s = {read_bytes / 1e6 / elapsed_seconds:.1f} MB/s")
          EOF

      - name: Background throttling
        run: |
          # macOS throttles the network of darwin-background processes; clear the flag on this shell and probe again.
          taskpolicy -B -p $$ && echo "cleared the background flag on this shell" || echo "could not clear the background flag"
          curl -sS -L -r 0-199999999 --max-time 20 -o /dev/null -w "%{speed_download}\n" "https://huggingface.co/$HF_FILE" 2>/dev/null |
            awk '{printf "huggingface.co after clearing: %.1f MB/s\n", $1 / 1e6}'
