name: Label documentation pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add path-based labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            const existingLabels = new Set(
              pullRequest.labels.map(({ name }) => name)
            );
            const { owner, repo } = context.repo;
            const labelRules = [
              {
                label: 'documentation',
                matches: (path) =>
                  path?.startsWith('docs/') ||
                  path === 'README.md' ||
                  path === 'CONTRIBUTING.md',
              },
            ];
            const pages = github.paginate.iterator(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const labelsToAdd = new Set();
            for await (const { data: files } of pages) {
              for (const { filename, previous_filename } of files) {
                for (const rule of labelRules) {
                  if (
                    rule.matches(filename) ||
                    rule.matches(previous_filename)
                  ) {
                    if (!existingLabels.has(rule.label)) {
                      labelsToAdd.add(rule.label);
                    } else {
                    }
                  } else {
                  }
                }
              }
            }
            if (!labelsToAdd.size) {
              return;
            } else {
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.number,
              labels: [...labelsToAdd],
            });