name: Voxt Homebrew

# Points the sgl-project/homebrew-voxt tap (brew install --cask sgl-project/voxt/voxt) at a stable
# Voxt release once it is published: Voxt/scripts/homebrew-cask.sh writes Casks/voxt.rb from the
# release's disk image digest and its .sha256 file, and this opens a pull request on the tap with it;
# the tap's own checks run brew audit and brew style on that pull request. Betas get no cask.
# Run it by hand with a tag to redo one. VOXT_HOMEBREW_TAP_TOKEN, a secret of the voxt-release
# environment, may write contents and pull requests of that tap only (Voxt/docs/release.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag, e.g. voxt-v2.1.4"
        required: true
        type: string

concurrency:
  group: voxt-homebrew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cask:
    name: Voxt Homebrew cask
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'voxt-v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: voxt-release
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      TAP: sgl-project/homebrew-voxt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Write the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#voxt-v}"
          dmg="Voxt-$version-arm64.dmg"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$dmg\") | .digest")"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg.sha256" --dir "$RUNNER_TEMP"
          Voxt/scripts/homebrew-cask.sh "$version" "$RUNNER_TEMP/$dmg.sha256" "$digest" > "$RUNNER_TEMP/voxt.rb"
          cat "$RUNNER_TEMP/voxt.rb"

      - name: Open a pull request on the tap
        env:
          GH_TOKEN: ${{ secrets.VOXT_HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The voxt-release environment has no VOXT_HOMEBREW_TAP_TOKEN"
            exit 1
          else
            :
          fi
          version="${TAG#voxt-v}"
          branch="voxt-$version"
          if [[ -n "$(gh pr list --repo "$TAP" --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            echo "A pull request for Voxt $version is already open on $TAP"
            exit 0
          else
            :
          fi
          gh auth setup-git
          tap="$RUNNER_TEMP/tap"
          gh repo clone "$TAP" "$tap" -- --depth 1
          cd "$tap"
          mkdir -p Casks
          cp "$RUNNER_TEMP/voxt.rb" Casks/voxt.rb
          if [[ -z "$(git status --porcelain -- Casks/voxt.rb)" ]]; then
            echo "The tap already offers Voxt $version"
            exit 0
          else
            :
          fi
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "voxt $version" -- Casks/voxt.rb
          git push origin "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "voxt $version" \
            --body "Voxt $version from https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG, written by Voxt/scripts/homebrew-cask.sh in $GITHUB_REPOSITORY (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
