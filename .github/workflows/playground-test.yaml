name: Playground Test

on:
  pull_request:
    # A pull request that changes only the MLX path is tested by Mac CI and Voxt CI.
    paths-ignore:
      - "sglang_omni_mlx/**"
      - "Voxt/**"
      - ".github/workflows/mac-ci.yaml"
      - ".github/workflows/voxt*.yaml"
  workflow_dispatch:

concurrency:
  group: playground-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test realtime playback state
        run: node --test playground/qwen-omni/realtime/playback.test.js

      - name: Test cascade demo heard text and settings
        run: node --test playground/cascade/frontend/orb/*.test.mjs

      - name: Test native realtime playback cadence and lifecycle
        run: node --test playground/realtime/frontend/orb/*.test.mjs
