name: Omni CI

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
    # A pull request that changes only the MLX path is tested by Mac CI and Voxt CI, and Mac CI checks its labels.
    paths-ignore:
      - "sglang_omni_mlx/**"
      - "Voxt/**"
      - ".github/workflows/mac-ci.yaml"
      - ".github/workflows/voxt*.yaml"
  workflow_dispatch:
    inputs:
      ci_labels:
        description: "Space-separated CI labels, resolved like PR labels (e.g. 'run-tts-ci run-moss-tts-local-transformer-v1.5')."
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  ci:
    uses: sgl-project/sglang-omni/.github/workflows/self-hosted-omni.yaml@main
    secrets: inherit
