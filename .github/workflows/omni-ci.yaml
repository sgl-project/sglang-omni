name: Omni CI

# DAG:
#   preflight -> setup -> pr-test -> asr-ci -> tts-ci -> qwen3-omni-ci
#                  |         |          |         |              |
#                  +---------+----------+---------+--------------+-> cleanup (dispatch only)
#
# Benchmark suites wait for the previous suite to finish but use always() so a
# failed unit/benchmark suite does not skip later suites. Only setup blocks all
# downstream model CI.
#
# PR-scoped homes (/data/omni-ci/pr-<N>) persist on the runner for reuse across
# pushes (runner TTL, e.g. 3 days). reconcile_omni_ci_env.sh validates fingerprint,
# pins, and imports before reuse; otherwise rebuilds OMNI_CI_HOME.
# cleanup-pr-ci-home-on-close.yaml removes the home when the PR closes.
#
# OMNI_CI_HOME must live under /data/omni-ci (a persistent host bind mount), NOT
# under /github/home: the runner's TempDirectoryManager wipes /github/home
# (= _work/_temp/_github_home, its RUNNER_TEMP) at every job boundary, which would
# delete the prepared venv between jobs and force every stage to rebuild.


on:
  pull_request:
    branches: [main]
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tts_ci_model:
        description: "Optional TTS CI model preset to run (higgs or moss). Leave empty for random."
        required: false
        type: string
        default: ""
      asr_ci_model:
        description: "Optional ASR CI model preset to run (fun or qwen3). Leave empty for random."
        required: false
        type: string
        default: ""

concurrency:
  group: omni-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  OMNI_CI_HOME: >-
    ${{ github.event_name == 'pull_request'
        && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
        || format('/data/omni-ci/run-{0}', github.run_id) }}
  TTS_MODEL_PATH: bosonai/higgs-tts-3-4b
  MOSS_TTS_MODEL_PATH: OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5
  QWEN3_ASR_MODEL_PATH: Qwen/Qwen3-ASR-1.7B
  MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH: OpenMOSS-Team/MOSS-Transcribe-Diarize
  FUN_ASR_MODEL_PATH: FunAudioLLM/Fun-ASR-Nano-2512-hf


jobs:
  preflight:
    name: omni-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      labels: ${{ steps.pr.outputs.labels || '[]' }}
      selected_model: ${{ steps.tts.outputs.selected_model }}
      selection_digest: ${{ steps.tts.outputs.selection_digest }}
      resolved_mps_config: ${{ steps.tts.outputs.resolved_mps_config }}
      exact_sha: ${{ steps.tts.outputs.exact_sha }}
    steps:
      - name: Fetch latest PR gate state
        if: ${{ github.event_name == 'pull_request' }}
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // Reruns reuse the original pull_request event payload, so fetch
            // live labels/draft state after /tag-and-rerun-ci adds run-ci.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("labels", JSON.stringify(pr.data.labels.map((label) => label.name)));
            core.setOutput("draft", pr.data.draft ? "true" : "false");

      - name: Log PR gate state
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "PR labels: ${{ steps.pr.outputs.labels }}"
          echo "PR draft: ${{ steps.pr.outputs.draft }}"

      - name: Block draft PR
        if: ${{ github.event_name == 'pull_request' && fromJson(steps.pr.outputs.draft) }}
        run: |
          echo "PR is draft. Blocking Omni CI."
          exit 1

      - name: Require run-ci label
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "${{ contains(fromJson(steps.pr.outputs.labels), 'run-ci') }}" == "false" ]]; then
            echo "Missing required label 'run-ci'. Add the label or use /tag-and-rerun-ci to opt into Omni CI."
            exit 1
          fi

      - name: Checkout workflow scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout workflow scripts for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Select TTS model once
        id: tts
        shell: bash
        env:
          RUN_HIGGS_LABEL: ${{ contains(fromJson(steps.pr.outputs.labels || '[]'), 'run-higgs') }}
          RUN_MOSS_LABEL: ${{ contains(fromJson(steps.pr.outputs.labels || '[]'), 'run-moss') }}
          TTS_CI_MODEL_OVERRIDE: ${{ github.event.inputs.tts_ci_model }}
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          models=(higgs moss)
          override="${TTS_CI_MODEL_OVERRIDE,,}"
          if [[ "${RUN_HIGGS_LABEL}" == "true" && "${RUN_MOSS_LABEL}" == "true" ]]; then
            echo "::error::run-higgs and run-moss labels cannot both be set"
            exit 1
          fi

          selection_digest=""
          if [[ -n "${override}" ]]; then
            if [[ "${override}" != "higgs" && "${override}" != "moss" ]]; then
              echo "::error::unsupported tts_ci_model=${TTS_CI_MODEL_OVERRIDE}; expected higgs or moss"
              exit 1
            fi
            selected_model="${override}"
            selection_reason="workflow_dispatch_override"
          elif [[ "${RUN_HIGGS_LABEL}" == "true" ]]; then
            selected_model="higgs"
            selection_reason="run-higgs_label"
          elif [[ "${RUN_MOSS_LABEL}" == "true" ]]; then
            selected_model="moss"
            selection_reason="run-moss_label"
          else
            selection_digest="$(printf "%s" "${GITHUB_RUN_ID}" | sha256sum | awk '{print $1}')"
            selection_index=$((16#${selection_digest: -1} % 2))
            selected_model="${models[${selection_index}]}"
            selection_reason="stable_github_run_id_digest"
          fi

          if [[ "${selected_model}" == "higgs" ]]; then
            resolved_config="examples/mps_dp/configs/higgs_h100_dp3.yaml"
            expected_config_cls="HiggsTtsPipelineConfig"
          else
            resolved_config="examples/mps_dp/configs/moss_local_h100_dp2.yaml"
            expected_config_cls="MossTTSLocalPipelineConfig"
          fi
          if [[ ! -f "${resolved_config}" ]]; then
            echo "::error::MPS config is missing for ${selected_model}: ${resolved_config}"
            exit 1
          fi
          actual_config_cls="$(sed -n 's/^config_cls:[[:space:]]*//p' "${resolved_config}")"
          if [[ "${actual_config_cls}" != "${expected_config_cls}" ]]; then
            echo "::error::resolved config mismatch for ${selected_model}: ${actual_config_cls}; expected ${expected_config_cls}"
            exit 1
          fi

          output_dir="${RUNNER_TEMP}/tts-preflight"
          mkdir -p "${output_dir}"
          export selected_model selection_digest selection_reason resolved_config
          python - <<'PY' > "${output_dir}/preflight.json.tmp"
          import json
          import os

          print(
              json.dumps(
                  {
                      "schema_version": 1,
                      "exact_sha": os.environ["EXACT_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "workflow_url": (
                          f"{os.environ['GITHUB_SERVER_URL']}/"
                          f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                          f"{os.environ['GITHUB_RUN_ID']}"
                      ),
                      "selected_model": os.environ["selected_model"],
                      "selection_digest": os.environ["selection_digest"],
                      "selection_reason": os.environ["selection_reason"],
                      "resolved_mps_config": os.environ["resolved_config"],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          mv "${output_dir}/preflight.json.tmp" "${output_dir}/preflight.json"
          echo "selected_model=${selected_model}" >> "${GITHUB_OUTPUT}"
          echo "selection_digest=${selection_digest}" >> "${GITHUB_OUTPUT}"
          echo "resolved_mps_config=${resolved_config}" >> "${GITHUB_OUTPUT}"
          echo "exact_sha=${EXACT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload TTS preflight
        uses: actions/upload-artifact@v4
        with:
          name: tts-preflight
          path: ${{ runner.temp }}/tts-preflight/preflight.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Check PR lint and mergeability
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_ci_gate.py

      - name: Manual dispatch preflight
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Manual workflow_dispatch bypasses PR lint/mergeability gate."

  setup:
    name: setup - omni venv
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: [self-hosted, h100]
    timeout-minutes: 30
    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assess CI environment completeness
        id: env_state
        shell: bash
        run: |
          echo "OMNI_CI_HOME=${OMNI_CI_HOME}"
          if bash .github/scripts/validate_omni_env_reusable.sh omni; then
            echo "action=reuse" >> "${GITHUB_OUTPUT}"
            echo "Existing environment passes reuse gate; will refresh editable install."
          else
            echo "action=rebuild" >> "${GITHUB_OUTPUT}"
            echo "Environment missing or drifted; will reconcile or rebuild."
          fi

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni
          install-deps: "true"

      - uses: ./.github/actions/omni-save-cache
        with:
          venv-name: omni

      - name: Ensure CI model weights
        shell: bash
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash .github/scripts/ensure_hf_models.sh omni \
            Qwen/Qwen3-Omni-30B-A3B-Instruct \
            marksverdhei/Qwen3-Omni-30B-A3B-FP8 \
            "${QWEN3_ASR_MODEL_PATH}" \
            "${MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH}" \
            "${TTS_MODEL_PATH}" \
            "${MOSS_TTS_MODEL_PATH}" \
            "${FUN_ASR_MODEL_PATH}"

      - name: Mark PR environment complete
        shell: bash
        run: bash .github/scripts/mark_omni_env_complete.sh omni

      - name: Verify setup completion marker
        shell: bash
        run: bash .github/scripts/validate_omni_env_complete.sh omni

  pick-asr-model:
    name: pick ASR model
    needs: [preflight, setup]
    if: needs.preflight.result == 'success' && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      asr_ci_model: ${{ steps.pick.outputs.asr_ci_model }}
    steps:
      - id: pick
        env:
          PR_LABELS: ${{ needs.preflight.outputs.labels || '[]' }}
          RUN_FUN_ASR_LABEL: ${{ contains(fromJson(needs.preflight.outputs.labels || '[]'), 'run-fun-asr') }}
          RUN_QWEN3_ASR_LABEL: ${{ contains(fromJson(needs.preflight.outputs.labels || '[]'), 'run-qwen3-asr') }}
          ASR_CI_MODEL_OVERRIDE: ${{ github.event.inputs.asr_ci_model }}
        run: |
          models=(fun qwen3)
          selected=""
          override="${ASR_CI_MODEL_OVERRIDE,,}"
          if [[ -n "${override}" ]]; then
            for model in "${models[@]}"; do
              if [[ "${override}" == "${model}" ]]; then
                selected="${model}"
                break
              fi
            done
            if [[ -z "${selected}" ]]; then
              echo "::error::Unsupported asr_ci_model='${ASR_CI_MODEL_OVERRIDE}'. Expected one of: ${models[*]}"
              exit 1
            fi
          else
            if [[ "${RUN_FUN_ASR_LABEL}" == "true" && "${RUN_QWEN3_ASR_LABEL}" == "true" ]]; then
              echo "::error::Multiple ASR model labels found in PR labels ${PR_LABELS}. Keep only one of: run-fun-asr run-qwen3-asr"
              exit 1
            fi
            if [[ "${RUN_FUN_ASR_LABEL}" == "true" ]]; then
              selected="fun"
            elif [[ "${RUN_QWEN3_ASR_LABEL}" == "true" ]]; then
              selected="qwen3"
            fi
          fi
          if [[ -z "${selected}" ]]; then
            seed="$(date +%s%N)"
            RANDOM=$((seed % 32768))
            selected="${models[$((RANDOM % ${#models[@]}))]}"
            echo "Random seed for ASR CI model: ${seed}"
          fi
          echo "Selected ASR CI model: ${selected}"
          echo "asr_ci_model=${selected}" >> "$GITHUB_OUTPUT"

  asr-ci:
    name: ASR CI
    needs: [setup, pr-test, pick-asr-model]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.pick-asr-model.result == 'success'
    uses: ./.github/workflows/test-asr-ci.yaml
    with:
      asr_ci_model: ${{ needs.pick-asr-model.outputs.asr_ci_model }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  tts-ci:
    name: TTS CI
    needs: [preflight, setup, pr-test, asr-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.preflight.result == 'success'
    uses: ./.github/workflows/test-tts-ci.yaml
    with:
      tts_ci_model: ${{ needs.preflight.outputs.selected_model }}
      tts_mps_config: ${{ needs.preflight.outputs.resolved_mps_config }}
      exact_sha: ${{ needs.preflight.outputs.exact_sha }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  qwen3-omni-ci:
    name: Qwen3-Omni CI
    needs: [setup, pr-test, asr-ci, tts-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success'
    uses: ./.github/workflows/test-qwen3-omni-ci.yaml
    with:
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  pr-test:
    name: PR Test
    needs: setup
    if: >-
      needs.setup.result == 'success'
    uses: ./.github/workflows/test.yaml
    with:
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  cleanup:
    name: cleanup - reclaim ephemeral run home
    needs: [setup, pr-test, asr-ci, tts-ci, qwen3-omni-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-cleanup-host
        with:
          ci-home: ${{ env.OMNI_CI_HOME }}
