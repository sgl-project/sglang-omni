name: Omni CI

# DAG:
#   preflight -> setup -> pr-test -> asr-ci -> tts-ci -> mps-ci -> qwen3-omni-ci
#   setup + unit/model suites -> cleanup (dispatch only)
#
# preflight resolves the CI labels with .github/scripts/resolve_ci_labels.py:
# any stage label, including run-unit-test-ci-only, runs pr-test, and each model
# suite runs only when its stage is selected. run-lint-only passes the gate and
# skips setup. Model suites wait for the previous suite to finish but use always()
# so a failed or skipped suite does not skip later suites. Only setup blocks all
# downstream model CI.
#
# PR-scoped homes (/data/omni-ci/pr-<N>) persist on the runner for reuse across
# pushes (runner TTL, e.g. 3 days). reconcile_omni_ci_env.sh validates fingerprint,
# pins, and imports before reuse; otherwise rebuilds OMNI_CI_HOME.
# cleanup-pr-ci-home-on-close.yaml removes the home when the PR closes.
#
# OMNI_CI_HOME must live under /data/omni-ci (a persistent host bind mount), NOT
# under /github/home: the runner's TempDirectoryManager wipes /github/home
# (= _work/_temp/_github_home, its RUNNER_TEMP) at every job boundary, which would
# delete the prepared venv between jobs and force every stage to rebuild.


on:
  pull_request:
    branches: [main]
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ci_labels:
        description: "Space-separated CI labels, resolved like PR labels (e.g. 'run-tts-ci run-moss-tts-local-transformer-v1.5')."
        required: false
        type: string
        default: run-all-ci

concurrency:
  group: omni-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  OMNI_CI_HOME: >-
    ${{ github.event_name == 'pull_request'
        && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
        || format('/data/omni-ci/run-{0}', github.run_id) }}
  TTS_MODEL_PATH: bosonai/higgs-tts-3-4b
  MOSS_TTS_MODEL_PATH: OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5
  QWEN3_TTS_MODEL_PATH: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  COSYVOICE3_MODEL_PATH: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
  QWEN3_TTS_CUSTOM_VOICE_MODEL_PATH: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  QWEN3_ASR_MODEL_PATH: Qwen/Qwen3-ASR-1.7B
  MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH: OpenMOSS-Team/MOSS-Transcribe-Diarize
  FUN_ASR_MODEL_PATH: FunAudioLLM/Fun-ASR-Nano-2512-hf
  WHISPER_ASR_MODEL_PATH: openai/whisper-large-v3


jobs:
  preflight:
    name: omni-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_self_hosted: ${{ steps.plan.outputs.run_self_hosted }}
      run_asr: ${{ steps.plan.outputs.run_asr }}
      run_tts: ${{ steps.plan.outputs.run_tts }}
      run_mps: ${{ steps.plan.outputs.run_mps }}
      run_omni: ${{ steps.plan.outputs.run_omni }}
      asr_ci_model: ${{ steps.plan.outputs.asr_ci_model }}
      tts_ci_model: ${{ steps.plan.outputs.tts_ci_model }}
      mps_ci_model: ${{ steps.plan.outputs.mps_ci_model }}
      mps_ci_config: ${{ steps.plan.outputs.mps_ci_config }}
      omni_ci_model: ${{ steps.plan.outputs.omni_ci_model }}
    steps:
      - name: Fetch CI labels
        id: pr
        uses: actions/github-script@v7
        env:
          DISPATCH_CI_LABELS: ${{ github.event.inputs.ci_labels }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.eventName === "workflow_dispatch") {
              const labels = process.env.DISPATCH_CI_LABELS.split(/\s+/).filter(Boolean);
              core.setOutput("labels", JSON.stringify(labels));
              core.setOutput("draft", "false");
            } else {
              // Reruns reuse the original pull_request event payload, so fetch
              // the live labels and draft state.
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput("labels", JSON.stringify(pr.data.labels.map((label) => label.name)));
              core.setOutput("draft", pr.data.draft ? "true" : "false");
            }

      - name: Log CI gate state
        run: |
          echo "CI labels: ${{ steps.pr.outputs.labels }}"
          echo "PR draft: ${{ steps.pr.outputs.draft }}"

      - name: Block draft PR
        if: ${{ fromJson(steps.pr.outputs.draft) }}
        run: |
          echo "PR is draft. Blocking Omni CI."
          exit 1

      - name: Checkout workflow scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout workflow scripts for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Resolve CI stages and models
        id: plan
        env:
          LABELS_JSON: ${{ steps.pr.outputs.labels }}
        run: |
          python .github/scripts/resolve_ci_labels.py resolve \
            --labels-json "${LABELS_JSON}" \
            --seed "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Check PR lint and mergeability
        if: ${{ github.event_name == 'pull_request' && steps.plan.outputs.run_self_hosted == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_ci_gate.py

      - name: Manual dispatch preflight
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Manual workflow_dispatch bypasses PR lint/mergeability gate."

  setup:
    name: setup - omni venv
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.run_self_hosted == 'true'
    runs-on: [self-hosted, h100]
    timeout-minutes: 30
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assess CI environment completeness
        id: env_state
        shell: bash
        run: |
          echo "OMNI_CI_HOME=${OMNI_CI_HOME}"
          if bash .github/scripts/validate_omni_env_reusable.sh omni; then
            echo "action=reuse" >> "${GITHUB_OUTPUT}"
            echo "Existing environment passes reuse gate; will refresh editable install."
          else
            echo "action=rebuild" >> "${GITHUB_OUTPUT}"
            echo "Environment missing or drifted; will reconcile or rebuild."
          fi

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni
          install-deps: "true"

      - name: Build Rust router
        shell: bash
        run: |
          binary="$(bash .github/scripts/prepare_rust_router.sh build)"
          echo "SGLANG_OMNI_ROUTER_BIN=${binary}" >> "${GITHUB_ENV}"

      - uses: ./.github/actions/omni-save-cache
        with:
          venv-name: omni

      - name: Ensure CI model weights
        shell: bash
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OMNI_CI_MODEL: ${{ needs.preflight.outputs.omni_ci_model }}
        run: |
          bash .github/scripts/ensure_hf_models.sh omni \
            Qwen/Qwen3-Omni-30B-A3B-Instruct \
            marksverdhei/Qwen3-Omni-30B-A3B-FP8 \
            "${QWEN3_ASR_MODEL_PATH}" \
            "${MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH}" \
            "${TTS_MODEL_PATH}" \
            "${MOSS_TTS_MODEL_PATH}" \
            "${QWEN3_TTS_MODEL_PATH}" \
            "${COSYVOICE3_MODEL_PATH}" \
            "${QWEN3_TTS_CUSTOM_VOICE_MODEL_PATH}" \
            "${FUN_ASR_MODEL_PATH}" \
            "${WHISPER_ASR_MODEL_PATH}"

          if [[ "${OMNI_CI_MODEL}" == "minicpmo" ]]; then
            bash .github/scripts/ensure_hf_models.sh omni openbmb/MiniCPM-o-4_5
          fi

      - name: Mark PR environment complete
        shell: bash
        run: bash .github/scripts/mark_omni_env_complete.sh omni

      - name: Verify setup completion marker
        shell: bash
        run: bash .github/scripts/validate_omni_env_complete.sh omni

  asr-ci:
    name: ASR CI
    needs: [preflight, setup, pr-test]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.preflight.outputs.run_asr == 'true'
    uses: ./.github/workflows/test-asr-ci.yaml
    with:
      asr_ci_model: ${{ needs.preflight.outputs.asr_ci_model }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  tts-ci:
    name: TTS CI
    needs: [preflight, setup, pr-test, asr-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.preflight.outputs.run_tts == 'true'
    uses: ./.github/workflows/test-tts-ci.yaml
    with:
      tts_ci_model: ${{ needs.preflight.outputs.tts_ci_model }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  mps-ci:
    name: MPS CI
    needs: [preflight, setup, pr-test, asr-ci, tts-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.preflight.outputs.run_mps == 'true'
    uses: ./.github/workflows/test-mps-ci.yaml
    with:
      mps_ci_model: ${{ needs.preflight.outputs.mps_ci_model }}
      mps_ci_config: ${{ needs.preflight.outputs.mps_ci_config }}
      exact_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  qwen3-omni-ci:
    name: Omni model CI (${{ needs.preflight.outputs.omni_ci_model }})
    needs: [preflight, setup, pr-test, asr-ci, tts-ci, mps-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.preflight.outputs.run_omni == 'true'
    uses: ./.github/workflows/test-qwen3-omni-ci.yaml
    with:
      omni_ci_model: ${{ needs.preflight.outputs.omni_ci_model }}
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  pr-test:
    name: PR Test
    needs: setup
    if: >-
      needs.setup.result == 'success'
    uses: ./.github/workflows/test.yaml
    with:
      omni_ci_home: >-
        ${{ github.event_name == 'pull_request'
            && format('/data/omni-ci/pr-{0}', github.event.pull_request.number)
            || format('/data/omni-ci/run-{0}', github.run_id) }}
    secrets: inherit

  cleanup:
    name: cleanup - reclaim ephemeral run home
    needs: [setup, pr-test, asr-ci, tts-ci, mps-ci, qwen3-omni-ci]
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-cleanup-host
        with:
          ci-home: ${{ env.OMNI_CI_HOME }}
