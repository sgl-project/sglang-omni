name: CI Admission Gate

on:
  # zizmor: ignore[dangerous-triggers] - checks out trusted base only; inspects fork PR metadata via REST API
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: pr-ci-admission-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  evaluate:
    name: Evaluate CI Admission Gate
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.gate.outputs.outcome }}
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Evaluate fork pull request admission gate
        id: gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/pr_ci_admission_gate.py

  notify-maintainers:
    name: Notify Maintainers
    needs:
      - evaluate
    if: needs.evaluate.outputs.outcome == 'blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update manual review notice
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- pr-ci-admission-gate -->";
            const body = [
              marker,
              "### Manual CI Admission Review Required",
              "",
              "@fengxiaohu @0xtoward — manual review is requested for this pull request before CI runs are approved.",
              "Check the latest CI Admission Gate status for current results.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user &&
                comment.user.login === "github-actions[bot]" &&
                typeof comment.body === "string" &&
                comment.body.startsWith(marker),
            );
            if (existing) {
              if (existing.body === body) {
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  admission-gate:
    name: CI Admission Gate
    needs:
      - evaluate
    if: (success() || failure()) && needs.evaluate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce admission gate outcome
        env:
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          GATE_OUTCOME: ${{ needs.evaluate.outputs.outcome }}
        run: |
          if [ "${EVALUATE_RESULT}" = "success" ] && [ "${GATE_OUTCOME}" = "passed" ]; then
            echo "CI Admission Gate passed."
          elif [ "${GATE_OUTCOME}" = "superseded" ]; then
            echo "CI Admission Gate superseded by a newer pull request update." >&2
            exit 1
          else
            echo "::error::CI Admission Gate requires manual maintainer review." >&2
            exit 1
          fi
