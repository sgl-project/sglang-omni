name: Mac Metal CI

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
    paths:
      - "sglang_omni_mlx/**"
      - ".github/workflows/mac-metal-ci.yaml"
      - ".github/workflows/self-hosted-mac-metal.yaml"
  workflow_dispatch:
    inputs:
      suite:
        description: Which Metal test suite to run
        type: choice
        default: all
        options:
          - all
          - core
          - api
          - golden

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  ci:
    uses: sgl-project/sglang-omni/.github/workflows/self-hosted-mac-metal.yaml@main
    secrets: inherit
