name: PR Test

on:
  workflow_call:

env:
  OMNI_CI_HOME: /data/omni-ci/run-${{ github.run_id }}

# Invoked by omni-ci.yaml after shared setup for the H100 accelerator unit-test
# partitions; CPU unit tests run on GitHub-hosted runners in omni-ci.yaml.
# The model suites start once PR Test finishes (see the DAG note in
# omni-ci.yaml). Any stage label except run-mac-ci runs it. run-lint-only does
# not. Restores omni only.

jobs:
  authorize:
    uses: ./.github/workflows/authorize-self-hosted.yml

  unit-test-accelerator:
    needs: authorize
    name: ${{ matrix.name }}
    runs-on:
      group: sglang-omni-ci
      labels: [h100]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-test-accelerator-a
            partition: 0
          - name: unit-test-accelerator-b
            partition: 1
    container:
      image: hongccc/sglang-omni@sha256:d2fbd80ec42c8a6d9dff4b8a4fdbee35d50c5a1b41aa8dc872925da6e0c82f6a
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run accelerator test
        timeout-minutes: 30
        shell: bash
        env:
          OMNI_CI_STAGE_LABEL: ${{ matrix.name }}
          # note (wilsonzheng0327): SGLANG_CACHE_DIR/inductor holds conv graphs compiled while a test leaked cuDNN off, and the cache key does not record cuDNN.
          TORCHINDUCTOR_CACHE_DIR: /data/omni-ci/sglang-cache/inductor-unit-test-accelerator
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/ -v -m "accelerator and not benchmark" -x \
            -p scripts.ci.utils.pytest_partition \
            --auto-partition-id "${{ matrix.partition }}" \
            --auto-partition-size 2 \
            --partition-model-file .github/unit_test_accelerator_durations.json
