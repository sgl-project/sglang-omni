name: Release Docker Images (NPU)

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to Docker Hub
        type: boolean
        default: true
  workflow_call:
    inputs:
      image_tag:
        description: Additional tag prefix (the hardware suffix is appended)
        type: string
        default: ''
      publish:
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-npu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preprocess:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      base_image_a3: ${{ steps.config.outputs.base_image_a3 }}
      base_image_910b: ${{ steps.config.outputs.base_image_910b }}
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      # Reuse the standard Docker Hub secrets used by SGLang's lmsysorg releases.
      - name: Validate publication settings
        id: publication
        env:
          REQUESTED: ${{ github.event_name != 'pull_request' && (inputs.publish || github.event_name == 'push') }}
          REPOSITORY: ${{ github.repository }}
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$REQUESTED" == true ]]; then
            [[ "$REPOSITORY" == sgl-project/sglang-omni ]] || { echo 'Publication is restricted to the upstream repository.' >&2; exit 1; }
            [[ -n "$HUB_USERNAME" && -n "$HUB_TOKEN" ]] || { echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.' >&2; exit 1; }
          fi
          echo "publish=$REQUESTED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check NPU configuration and installer without hardware
        run: |
          python -m pip install pytest==8.3.5 packaging==25.0
          python -m pytest tests/unit_test/npu/test_npu_config.py tests/unit_test/npu/test_npu_install_script.py -q
      - name: Read shared NPU configuration
        id: config
        run: |
          matrix=$(python scripts/npu/config.py --matrix)
          base_image_a3=$(python scripts/npu/config.py --get base-image-a3)
          base_image_910b=$(python scripts/npu/config.py --get base-image-910b)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "base_image_a3=$base_image_a3" >> "$GITHUB_OUTPUT"
          echo "base_image_910b=$base_image_910b" >> "$GITHUB_OUTPUT"

  build_and_publish_arm64:
    needs: preprocess
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preprocess.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lmsysorg/sglang-omni
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=-cann${{ matrix.cann }}-${{ matrix.device }}
            type=sha,suffix=-cann${{ matrix.cann }}-${{ matrix.device }}
            type=raw,value=${{ inputs.image_tag }}-cann${{ matrix.cann }}-${{ matrix.device }},enable=${{ inputs.image_tag != '' }}
      - name: Log into Docker Hub
        if: needs.preprocess.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/npu.Dockerfile
          platforms: linux/arm64
          build-args: |
            SGLANG_IMAGE=${{ matrix.device == 'a3' && needs.preprocess.outputs.base_image_a3 || needs.preprocess.outputs.base_image_910b }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ needs.preprocess.outputs.publish == 'true' }}
          provenance: false
          cache-from: type=gha,scope=npu-${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=npu-${{ matrix.device }}
      - name: Record published image
        if: needs.preprocess.outputs.publish == 'true'
        env:
          IMAGE: lmsysorg/sglang-omni
          DIGEST: ${{ steps.build.outputs.digest }}
          DEVICE: ${{ matrix.device }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### NPU image: $DEVICE"
            echo "Image: $IMAGE@$DIGEST"
            printf 'Published tags:\n%s\n' "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
