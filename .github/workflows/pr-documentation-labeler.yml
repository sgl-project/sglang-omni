name: Label documentation pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add the documentation label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (pullRequest.labels.some(({ name }) => name === 'documentation')) {
              return;
            }

            const { owner, repo } = context.repo;
            const isDocumentationPath = (path) =>
              path?.startsWith('docs/') ||
              path === 'README.md' ||
              path === 'CONTRIBUTING.md';

            const pages = github.paginate.iterator(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            for await (const { data: files } of pages) {
              const touchesDocumentation = files.some(({ filename, previous_filename }) =>
                isDocumentationPath(filename) || isDocumentationPath(previous_filename)
              );
              if (touchesDocumentation) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  labels: ['documentation'],
                });
                return;
              }
            }
