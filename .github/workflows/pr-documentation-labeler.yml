name: Label pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request to label
        required: true
        type: number

permissions: {}

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Suggest pull request labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequest =
              context.payload.pull_request ??
              (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number('${{ github.event.pull_request.number || inputs.pr_number }}'),
              })).data;
            const existingLabels = new Set(
              pullRequest.labels.map(({ name }) => name)
            );
            const title = pullRequest.title;
            const branch = pullRequest.head.ref;
            const { owner, repo } = context.repo;

            const leadingTags = (text) =>
              [...text.matchAll(/\[([^\]]+)\]/gy)].map(([, tag]) =>
                tag.toLowerCase()
              );

            const isDocumentationPath = (path) =>
              path?.startsWith('docs/') ||
              path === 'README.md' ||
              path === 'CONTRIBUTING.md';

            const pages = github.paginate.iterator(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const changedFiles = [];
            for await (const { data: files } of pages) {
              changedFiles.push(...files);
            }

            const touchedPaths = new Set();
            for (const { filename, previous_filename } of changedFiles) {
              if (filename) {
                touchedPaths.add(filename);
              } else {
              }
              if (previous_filename) {
                touchedPaths.add(previous_filename);
              } else {
              }
            }

            const touchesDocumentationPath = [...touchedPaths].some((path) =>
              isDocumentationPath(path)
            );

            const docsOnlyPullRequest =
              changedFiles.length > 0 &&
              changedFiles.every(({ filename }) => isDocumentationPath(filename));

            const hasRunCiLabel = [...existingLabels].some((name) =>
              name.startsWith('run-')
            );

            const addedModelPackageInit = changedFiles.some(
              ({ filename, status }) =>
                status === 'added' &&
                /^sglang_omni\/models\/[^/]+\/__init__\.py$/.test(filename)
            );

            const labelsToAdd = new Set();
            const suggest = (label, matched) => {
              if (matched && !existingLabels.has(label)) {
                labelsToAdd.add(label);
              } else {
              }
            };

            const tags = leadingTags(title);
            const branchHas = (pattern) => pattern.test(branch);

            suggest(
              'documentation',
              touchesDocumentationPath ||
                tags.some((tag) => tag === 'docs' || tag === 'doc') ||
                /^docs\s*:/i.test(title.trim()) ||
                branchHas(/(?:^|[\/_.-])docs?(?=$|[\/_.-])/i)
            );

            suggest(
              'bug',
              tags.some((tag) =>
                ['fix', 'bugfix', 'hotfix'].includes(tag)
              ) ||
                /^(?:\[[^\]]+\]\s*)*(?:fix|fixes)(?:\([^)]+\))?!?:/i.test(
                  title
                ) ||
                /\b(?:bug(?:fix)?|regression|hotfix)\b/i.test(title) ||
                branchHas(
                  /(?:^|[\/_.-])(?:bug|bugfix|fix|hotfix|regression)(?=$|[\/_.-])/i
                )
            );

            suggest(
              'enhancement',
              tags.some((tag) =>
                ['feat', 'feature'].includes(tag)
              ) ||
                /\b(?:enhancement|feature|feat)\b/i.test(title) ||
                /^(?:\[[^\]]+\]\s*)*feat(?:\([^)]+\))?!?:/i.test(title) ||
                branchHas(
                  /(?:^|[\/_.-])(?:enhancement|feature|feat)(?=$|[\/_.-])/i
                )
            );

            suggest(
              'refactor',
              tags.some((tag) => tag === 'refactor') ||
                /^refactor(?:\([^)]+\))?!?:/i.test(title.trim()) ||
                branchHas(/(?:^|[\/_.-])refactor(?=$|[\/_.-])/i)
            );

            suggest(
              'model support',
              tags.some(
                (tag) => tag === 'model support' || tag === 'new model'
              ) ||
                /\badd\b.*\bsupport\b/i.test(title) ||
                /^support\s+\S+/i.test(title) ||
                addedModelPackageInit
            );

            suggest(
              'good first issue',
              /\bgood[\s_-]+first[\s_-]+(?:issue|pr|pull request)\b/i.test(
                title
              ) ||
                branchHas(
                  /(?:^|[\/_.-])good[-_]first[-_](?:issue|pr)(?=$|[\/_.-])/i
                )
            );

            suggest(
              'help wanted',
              /\b(?:help[\s_-]+wanted|needs?[\s_-]+help)\b/i.test(title) ||
                branchHas(
                  /(?:^|[\/_.-])(?:help[-_]wanted|needs?[-_]help)(?=$|[\/_.-])/i
                )
            );

            suggest(
              'run-lint-only',
              docsOnlyPullRequest && !hasRunCiLabel
            );

            if (!labelsToAdd.size) {
              return;
            } else {
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.number,
              labels: [...labelsToAdd],
            });