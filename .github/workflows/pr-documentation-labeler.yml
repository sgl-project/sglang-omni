name: Label pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request to label
        required: true
        type: number

permissions: {}

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Suggest pull request labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequest =
              context.payload.pull_request ??
              (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(process.env.PR_NUMBER),
              })).data;
            const existingLabels = new Set(
              pullRequest.labels.map(({ name }) => name)
            );
            const title = pullRequest.title;
            const { owner, repo } = context.repo;
            // Skip pushes so they do not re-add a title label that a maintainer removed.
            const skipTitleLabels = context.payload.action === 'synchronize';

            const leadingTags = (text) =>
              [...text.matchAll(/\[([^\]]+)\]/gy)].map(([, tag]) =>
                tag.toLowerCase()
              );

            const isDocumentationPath = (path) =>
              path?.startsWith('docs/') ||
              path === 'README.md' ||
              path === 'CONTRIBUTING.md';

            const pages = github.paginate.iterator(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const changedFiles = [];
            for await (const { data: files } of pages) {
              changedFiles.push(...files);
            }

            const hasOnlyDocumentationChanges =
              changedFiles.length > 0 &&
              changedFiles.every(({ filename, previous_filename }) =>
                isDocumentationPath(filename) &&
                (!previous_filename || isDocumentationPath(previous_filename))
              );

            const isRunCiLabel = (label) => label.startsWith('run-');
            const hasRunCiLabel = [...existingLabels].some(isRunCiLabel);

            const addedModelPackageInit = changedFiles.some(
              ({ filename, status }) =>
                status === 'added' &&
                /^sglang_omni\/models\/[^/]+\/__init__\.py$/.test(filename)
            );

            const titleLabelByTag = {
              fix: 'bug',
              bug: 'bug',
              bugfix: 'bug',
              hotfix: 'bug',
              feat: 'enhancement',
              feature: 'enhancement',
              enhancement: 'enhancement',
              refactor: 'refactor',
              'model support': 'model support',
              'new model': 'model support',
              'good first issue': 'good first issue',
              'help wanted': 'help wanted',
            };

            const authorLogin = pullRequest.user?.login?.toLowerCase() ?? '';
            const authorAssociation = pullRequest.author_association ?? '';
            const defaultBranch = pullRequest.base?.repo?.default_branch ?? 'main';
            const TRUSTED_AUTHOR_ASSOCIATIONS = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            async function resolveTrustDecision() {
              if (TRUSTED_AUTHOR_ASSOCIATIONS.has(authorAssociation)) {
                return `author_association=${authorAssociation}`;
              }
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: '.github/CODEOWNERS', ref: defaultBranch,
                });
                if (data.type !== 'file' || data.encoding !== 'base64' || typeof data.content !== 'string') {
                  throw new Error('Expected a base64-encoded CODEOWNERS file');
                }
                const bytes = Uint8Array.from(atob(data.content), char => char.charCodeAt(0));
                const contents = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                const owners = new Set();
                for (const line of contents.split('\n')) {
                  const [, ...tokens] = line.split('#', 1)[0].trim().split(/\s+/);
                  for (const token of tokens) {
                    if (/^@[A-Za-z0-9-]+$/.test(token)) {
                      owners.add(token.slice(1).toLowerCase());
                    }
                  }
                }
                if (owners.has(authorLogin)) {
                  return `matched .github/CODEOWNERS on ${defaultBranch}`;
                }
              } catch (error) {
                core.warning(`Cannot read .github/CODEOWNERS on ${defaultBranch}: ${error.message}`);
              }
              return null;
            }

            const trustReason = await resolveTrustDecision();
            const isTrustedContributor = trustReason !== null;
            core.info(isTrustedContributor
              ? `Author @${authorLogin} is trusted (${trustReason})`
              : `Author @${authorLogin} is untrusted (author_association=${authorAssociation})`);

            const labelsToAdd = new Set();
            const skippedRunCiLabels = new Set();
            const suggest = (label, matched) => {
              if (matched && !existingLabels.has(label)) {
                if (isRunCiLabel(label) && (!isTrustedContributor || pullRequest.draft)) {
                  skippedRunCiLabels.add(label);
                } else {
                  labelsToAdd.add(label);
                }
              }
            };

            if (!skipTitleLabels) {
              for (const tag of leadingTags(title)) {
                const label = titleLabelByTag[tag];
                if (label) {
                  suggest(label, true);
                }
              }
            }

            suggest('documentation', hasOnlyDocumentationChanges);
            suggest('model support', addedModelPackageInit);
            suggest('run-lint-only', hasOnlyDocumentationChanges && !hasRunCiLabel);

            if (skippedRunCiLabels.size) {
              core.info(`Suppressed CI labels (draft=${pullRequest.draft}): ${[...skippedRunCiLabels].join(', ')}`);
            }
            if (labelsToAdd.size) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pullRequest.number,
                labels: [...labelsToAdd],
              });
            }
            if (!hasOnlyDocumentationChanges && existingLabels.has('run-lint-only')) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pullRequest.number,
                name: 'run-lint-only',
              });
            }
