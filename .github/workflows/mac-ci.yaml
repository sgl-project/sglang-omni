name: Mac CI

# Builds the native MLX runtime (sglang_omni_mlx/native) on GitHub's macOS
# runners, then checks what the app relies on without running a model: the
# supervisor protocol, the transcription, speech, chat and realtime APIs (served by
# the stub server around stand-in models) and each server's startup checks;
# Voxt's Swift helper; and the helper's headless end-to-end tests
# (Voxt/scripts/mac-e2e.sh's Go steps). No
# checkpoint is downloaded. Model outputs are checked by hand per model PR with
# the tools in sglang_omni_mlx/native/ci. Voxt Nightly runs it before its build.
# Omni CI skips a pull request that changes only the MLX path, so this gate
# fails such a pull request without a CI label; a pull request that changes
# Voxt's code runs the Voxt helper tests job, the headless end-to-end tests
# included, and needs the same label. A pull request that changes only Voxt's
# documentation runs no Mac job and passes without one. A pull request runs
# only the job whose side it changes, Markdown aside, and both when it changes
# this file.

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
    paths:
      - "sglang_omni_mlx/**"
      - "Voxt/**"
      - ".github/workflows/mac-ci.yaml"
      - ".github/workflows/voxt*.yaml"
  workflow_dispatch:
  workflow_call:

# One run per pull request; a new push replaces it. The calling workflow's name keeps the nightly's run apart.
concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  preflight:
    name: mac-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Only a pull request goes through the label gate: a run by hand or from the nightly's schedule always tests.
      run_mac: ${{ github.event_name != 'pull_request' && 'true' || steps.plan.outputs.run_mac }}
      # A run off a pull request, or from Voxt Nightly, tests both sides.
      run_native_runtime: ${{ (github.event_name != 'pull_request' || github.workflow != 'Mac CI') && 'true' || steps.pr.outputs.has_native_runtime_changes }}
      run_voxt_helper: ${{ (github.event_name != 'pull_request' || github.workflow != 'Mac CI') && 'true' || steps.pr.outputs.has_voxt_helper_changes }}
    steps:
      - name: Fetch latest PR gate state
        if: ${{ github.event_name == 'pull_request' }}
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const labels = pr.data.labels.map((label) => label.name);
            core.setOutput("labels", JSON.stringify(labels));
            core.setOutput("draft", pr.data.draft ? "true" : "false");
            core.setOutput("is_selected", labels.includes("run-mac-ci"));

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changedPaths = changedFiles.flatMap((file) =>
              file.previous_filename ? [file.filename, file.previous_filename] : [file.filename]
            );
            const hasWorkflowChanges = changedPaths.includes(".github/workflows/mac-ci.yaml");
            const hasChangesUnder = (directory) =>
              hasWorkflowChanges || changedPaths.some((path) => path.startsWith(directory) && !path.endsWith(".md"));
            core.setOutput("has_native_runtime_changes", hasChangesUnder("sglang_omni_mlx/"));
            // Every Voxt code change runs the helper job, the headless end-to-end tests included.
            core.setOutput("has_voxt_helper_changes", hasChangesUnder("Voxt/"));
            // Documentation only: every path under Voxt/, all Markdown. No Mac job runs, as before.
            core.setOutput(
              "voxt_docs_only",
              changedPaths.every((path) => path.startsWith("Voxt/") && path.endsWith(".md"))
            );

      - name: Block draft PR
        if: ${{ steps.pr.outputs.is_selected == 'true' && fromJson(steps.pr.outputs.draft) && steps.pr.outputs.voxt_docs_only != 'true' }}
        run: |
          echo "PR is draft. Blocking Mac CI."
          exit 1

      - name: Checkout CI label rules
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4

      # Fails without a CI label, as Omni CI's gate does.
      - name: Resolve CI stages
        if: ${{ github.event_name == 'pull_request' }}
        id: plan
        env:
          LABELS_JSON: ${{ steps.pr.outputs.labels }}
          VOXT_DOCS_ONLY: ${{ steps.pr.outputs.voxt_docs_only }}
        run: |
          if resolved=$(python .github/scripts/resolve_ci_labels.py resolve \
            --labels-json "${LABELS_JSON}" \
            --seed "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"); then
            echo "${resolved}"
            exit 0
          fi
          if [ "${VOXT_DOCS_ONLY}" != "true" ]; then
            echo "${resolved}"
            exit 1
          fi
          echo "::notice::Only Voxt's documentation changed: no Mac job runs, so no CI label is needed. Voxt CI tests it."
          echo "run_mac=false" >> "${GITHUB_OUTPUT}"

      - name: Check PR lint and mergeability
        if: ${{ github.event_name == 'pull_request' && steps.plan.outputs.run_mac == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_ci_gate.py

  native-runtime:
    name: native runtime (build + protocol)
    needs: [preflight]
    if: needs.preflight.outputs.run_mac == 'true' && needs.preflight.outputs.run_native_runtime == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install ccache
        run: |
          set -euo pipefail
          if ! command -v ccache > /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
          fi
          ccache --version | head -1

      # This keeps the objects of the runtime's own C and C++ and of its FetchContent dependencies.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: voxt-native-ccache-${{ env.DEVELOPER_DIR }}-${{ github.run_id }}
          restore-keys: voxt-native-ccache-${{ env.DEVELOPER_DIR }}-

      # build_runtime.sh builds MLX from the commit and patches it pins, Metal kernels included, which ccache does not keep: this keeps the installed build.
      - name: Restore the MLX build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/runtime-build/mlx
          key: voxt-native-mlx-${{ env.DEVELOPER_DIR }}-${{ hashFiles('sglang_omni_mlx/native/scripts/build_runtime.sh', 'sglang_omni_mlx/native/scripts/mlx-patches/**') }}

      - name: Build the runtime and checkpoint-free tests
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats > /dev/null
          sglang_omni_mlx/native/scripts/build_runtime.sh "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-build"
          "$RUNNER_TEMP/runtime-build/venv/bin/cmake" --build "$RUNNER_TEMP/runtime-build/cmake" --target stub_server audio_chunk_test ming3_mtp_probe arkasr_probe tokenizer_preference_test moss_model_test moss_realtime_test
          "$RUNNER_TEMP/runtime-build/cmake/audio_chunk_test"
          "$RUNNER_TEMP/runtime-build/cmake/tokenizer_preference_test"
          "$RUNNER_TEMP/runtime-build/cmake/moss_model_test"
          "$RUNNER_TEMP/runtime-build/cmake/moss_realtime_test"
          ccache --show-stats

      - name: Set up the test Python
        run: |
          uv venv -q -p 3.12 "$RUNNER_TEMP/test-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/test-venv" uv pip install -q -r sglang_omni_mlx/native/tests/requirements.lock

      - name: Protocol and startup tests
        env:
          NATIVE_STUB_SERVER: ${{ runner.temp }}/runtime-build/cmake/stub_server
          NATIVE_MING3_MTP_PROBE: ${{ runner.temp }}/runtime-build/cmake/ming3_mtp_probe
          NATIVE_ARKASR_PROBE: ${{ runner.temp }}/runtime-build/cmake/arkasr_probe
          NATIVE_RUNTIME_BIN: ${{ runner.temp }}/runtime/bin
        run: |
          "$RUNNER_TEMP/test-venv/bin/python" -m pytest -q sglang_omni_mlx/native/tests

  voxtnew-swift:
    name: Voxt helper tests
    needs: [preflight]
    if: needs.preflight.outputs.run_mac == 'true' && needs.preflight.outputs.run_voxt_helper == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The headless end-to-end tests (Voxt/mac_e2e_test.go) run the job's one
      # helper build through the real supervisor. VOXTNEW_MIN_FREE=0:
      # mac-e2e.sh's free-memory guard is for a Mac shared with other work; a
      # CI runner is dedicated, so the guard must not stop these steps.
      VOXTNEW_MAC_E2E: "1"
      VOXTNEW_HELPER: /tmp/voxtnew-mac-ci-helper/voxtnew-helper
      VOXTNEW_MIN_FREE: "0"
    steps:
      - uses: actions/checkout@v4

      # -warnings-as-errors leaves Swift 6 concurrency warnings as warnings, so the log is searched instead.
      - name: Helper builds without warnings
        run: |
          set -o pipefail
          swift build --package-path Voxt/helper 2>&1 | tee helper-build.log
          if grep -q 'warning:' helper-build.log; then
            echo "::error::the helper build has compiler warnings"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: Voxt/go.mod
          cache-dependency-path: Voxt/go.sum

      # The end-to-end tests below run this same build, signed as
      # scripts/build-helper.sh signs it, so the job builds the helper once.
      - name: Sign the helper for the end-to-end tests
        run: |
          bin="$(swift build --package-path Voxt/helper --show-bin-path)/voxtnew-helper"
          mkdir -p /tmp/voxtnew-mac-ci-helper
          cp "$bin" /tmp/voxtnew-mac-ci-helper/voxtnew-helper
          codesign --force --sign - --entitlements Voxt/helper/Support/helper.entitlements --options runtime /tmp/voxtnew-mac-ci-helper/voxtnew-helper

      - name: Vendored MyGo and native drop regressions
        working-directory: Voxt
        run: scripts/vendor-mygo.sh --check

      - name: Helper tests
        run: swift test --package-path Voxt/helper

      # The MyGo SQLite plugin loads a prebuilt library. The session test
      # would download it on first use, and its temporary HOME links to the
      # real cache; CI fetches it once, checks its sha256 against the
      # plugin's manifest and points the plugin at it (as Voxt CI does).
      - name: SQLite library for the MyGo plugin
        id: sqlite
        working-directory: Voxt
        run: |
          dir="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/sqlite"
          read -r url sum < <(jq -r '.libraries[0].files["darwin-arm64"] | "\(.url) \(.sha256)"' "$dir/mygo-plugin.json")
          echo "sha=$sum" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/voxtnew-ci/sqlite
          key: mygo-sqlite-darwin-${{ steps.sqlite.outputs.sha }}

      - name: Fetch and verify the SQLite library
        run: |
          mkdir -p ~/.cache/voxtnew-ci/sqlite
          lib=~/.cache/voxtnew-ci/sqlite/libmygo-sqlite3.dylib
          if [ ! -f "$lib" ]; then
            curl -fsSL --retry 3 -o "$lib" "${{ steps.sqlite.outputs.url }}"
          else
            echo "cached: $lib"
          fi
          echo "${{ steps.sqlite.outputs.sha }}  $lib" | shasum -a 256 -c -
          echo "MYGO_SQLITE_LIBRARY=$lib" >> "$GITHUB_ENV"

      # scripts/mac-e2e.sh's Go steps, without the script's limits for a
      # shared Mac: the real supervisor and helper, no window, key, tap,
      # clipboard or microphone. A skip must fail the step: a green log
      # without the test says nothing.
      - name: The helper, read-only and the file input
        working-directory: Voxt
        run: |
          set -o pipefail
          go test -count=1 -run 'TestMacHelperReadOnly|TestMacHelperIcons|TestMacHelperCaptureFile' -v . | tee "$RUNNER_TEMP/mac-e2e-helper.txt"
          ! grep -- '--- SKIP' "$RUNNER_TEMP/mac-e2e-helper.txt"

      - name: Text fit (Core Text)
        working-directory: Voxt
        env:
          VOXTNEW_TEXTFIT_PROBE: "1"
          VOXTNEW_TEXTFIT_AUDIT: strict
        run: |
          set -o pipefail
          go test -count=1 -run 'TestTextFitsItsOwnWidth|TestTranslationsFit' -v . | tee "$RUNNER_TEMP/mac-e2e-textfit.txt"
          ! grep -- '--- SKIP' "$RUNNER_TEMP/mac-e2e-textfit.txt"

      - name: A session over the fake local models
        working-directory: Voxt
        run: |
          set -o pipefail
          go test -count=1 -run 'TestMacE2ESessionLocal' -v . | tee "$RUNNER_TEMP/mac-e2e-session.txt"
          ! grep -- '--- SKIP' "$RUNNER_TEMP/mac-e2e-session.txt"

  # Temporary: reports what the donated mlx-pr Mac mini is before jobs move to it; drop before merging.
  mlx-pr-probe:
    name: mlx-pr runner probe
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: [mlx-pr]
    timeout-minutes: 20
    steps:
      # Each step reports everything it can, and a failed step does not hide the ones after it.
      - name: Host, VM, disk and toolchain
        run: |
          set +e
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH} user=$(id -un) home=${HOME} temp=${RUNNER_TEMP}"
          sw_vers
          uname -a
          for name in hw.model machdep.cpu.brand_string hw.ncpu hw.perflevel0.physicalcpu hw.perflevel1.physicalcpu hw.memsize kern.hv_vmm_present kern.boottime; do
            echo "${name}: $(sysctl -n "${name}" 2>&1)"
          done
          uptime
          # A fresh VM per job has no record of an earlier probe run.
          marker="${HOME}/.mlx-pr-probe-runs"
          echo "earlier probe runs in this home: $(cat "${marker}" 2>/dev/null || echo none)"
          echo "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} $(date -u +%FT%TZ)" >> "${marker}"
          df -h
          echo "MLX_CI_CACHE_ROOT=${MLX_CI_CACHE_ROOT:-<unset>}"
          ls -la "${HOME}" "${HOME}/.cache" 2>&1
          system_profiler SPDisplaysDataType SPHardwareDataType 2>&1 | grep -v -i -E "serial|uuid|udid"
          echo "workflow DEVELOPER_DIR=${DEVELOPER_DIR} exists=$(test -d "${DEVELOPER_DIR}" && echo yes || echo no)"
          unset DEVELOPER_DIR
          ls -d /Applications/Xcode*.app 2>&1
          xcode-select -p
          xcodebuild -version 2>&1
          xcrun --sdk macosx --show-sdk-version 2>&1
          xcrun -sdk macosx metal --version 2>&1
          for tool in brew uv ccache cmake python3 swift go git git-lfs; do
            echo "${tool}: $(command -v "${tool}" || echo missing)"
          done

      - name: Metal device
        continue-on-error: true
        run: |
          unset DEVELOPER_DIR
          cat > "${RUNNER_TEMP}/metal_probe.swift" <<'EOF'
          import Metal

          guard let device = MTLCreateSystemDefaultDevice() else {
              print("no Metal device")
              exit(1)
          }
          print("name: \(device.name)")
          if #available(macOS 14.0, *) {
              print("architecture: \(device.architecture.name)")
          }
          print("unified memory: \(device.hasUnifiedMemory)")
          print("recommended working set GB: \(Double(device.recommendedMaxWorkingSetSize) / 1e9)")
          print("max buffer GB: \(Double(device.maxBufferLength) / 1e9)")
          let families: [(String, MTLGPUFamily)] = [("apple7", .apple7), ("apple8", .apple8), ("apple9", .apple9), ("metal3", .metal3)]
          for (familyName, family) in families {
              print("\(familyName): \(device.supportsFamily(family))")
          }
          EOF
          xcrun swift "${RUNNER_TEMP}/metal_probe.swift"

      - uses: astral-sh/setup-uv@v6

      # MLX picks kernels from the GPU architecture name, and the VM reports air64_v27: each setting runs once as reported and once as a bare-metal M4 Pro and M5 Pro.
      - name: MLX on this GPU
        continue-on-error: true
        run: |
          set +e
          uv venv -q -p 3.12 "${RUNNER_TEMP}/probe-venv"
          VIRTUAL_ENV="${RUNNER_TEMP}/probe-venv" uv pip install -q mlx==0.32.5
          cat > "${RUNNER_TEMP}/mlx_probe.py" <<'EOF'
          import time

          import mlx.core as mx

          REPEATS = 20
          MATRIX_SIZE = 4096
          QUANTIZED_SIZE = 4096
          QUANTIZED_GROUP_SIZE = 64
          QUANTIZED_BITS = 4
          ATTENTION_HEADS = 16
          ATTENTION_HEAD_DIMENSION = 128
          ATTENTION_KEY_LENGTH = 2048

          print(f"MLX {mx.__version__}, architecture {mx.device_info()['architecture']}, NAX {mx.metal.is_nax_available()}")
          mx.random.seed(0)
          cases = []
          for dtype in (mx.float16, mx.bfloat16):
              left = mx.random.normal((MATRIX_SIZE, MATRIX_SIZE)).astype(dtype)
              right = mx.random.normal((MATRIX_SIZE, MATRIX_SIZE)).astype(dtype)
              cases.append(
                  (
                      f"{dtype} {MATRIX_SIZE} matmul",
                      lambda left=left, right=right: left @ right,
                      lambda left=left, right=right: left.astype(mx.float32) @ right.astype(mx.float32),
                      2 * MATRIX_SIZE**3,
                  )
              )
          weight = mx.random.normal((QUANTIZED_SIZE, QUANTIZED_SIZE)).astype(mx.float16)
          quantized_weight, scales, biases = mx.quantize(weight, group_size=QUANTIZED_GROUP_SIZE, bits=QUANTIZED_BITS)
          dequantized_weight = mx.dequantize(quantized_weight, scales, biases, group_size=QUANTIZED_GROUP_SIZE, bits=QUANTIZED_BITS)
          for rows in (1, 512):
              activations = mx.random.normal((rows, QUANTIZED_SIZE)).astype(mx.float16)
              cases.append(
                  (
                      f"4-bit affine quantized matmul, {rows} rows",
                      lambda activations=activations: mx.quantized_matmul(
                          activations, quantized_weight, scales, biases, transpose=True, group_size=QUANTIZED_GROUP_SIZE, bits=QUANTIZED_BITS
                      ),
                      lambda activations=activations: activations.astype(mx.float32) @ dequantized_weight.astype(mx.float32).T,
                      2 * rows * QUANTIZED_SIZE**2,
                  )
              )
          scale = ATTENTION_HEAD_DIMENSION**-0.5
          keys = mx.random.normal((1, ATTENTION_HEADS, ATTENTION_KEY_LENGTH, ATTENTION_HEAD_DIMENSION)).astype(mx.float16)
          values = mx.random.normal((1, ATTENTION_HEADS, ATTENTION_KEY_LENGTH, ATTENTION_HEAD_DIMENSION)).astype(mx.float16)
          for query_length in (1, 512):
              queries = mx.random.normal((1, ATTENTION_HEADS, query_length, ATTENTION_HEAD_DIMENSION)).astype(mx.float16)
              cases.append(
                  (
                      f"attention, {query_length} queries over {ATTENTION_KEY_LENGTH} keys",
                      lambda queries=queries: mx.fast.scaled_dot_product_attention(queries, keys, values, scale=scale),
                      lambda queries=queries: mx.softmax(
                          (queries.astype(mx.float32) * scale) @ keys.astype(mx.float32).swapaxes(-1, -2), axis=-1
                      )
                      @ values.astype(mx.float32),
                      4 * ATTENTION_HEADS * query_length * ATTENTION_KEY_LENGTH * ATTENTION_HEAD_DIMENSION,
                  )
              )
          for label, compute, compute_reference, flop_count in cases:
              try:
                  output = compute()
                  mx.eval(output)
                  start_seconds = time.perf_counter()
                  for _ in range(REPEATS):
                      mx.eval(compute())
                  milliseconds = (time.perf_counter() - start_seconds) / REPEATS * 1e3
                  with mx.stream(mx.cpu):
                      reference = compute_reference()
                      relative_error = mx.max(mx.abs(output.astype(mx.float32) - reference)) / mx.max(mx.abs(reference))
                      mx.eval(relative_error)
                  print(f"{label}: {milliseconds:.3f} ms, {flop_count / milliseconds / 1e9:.2f} TFLOPS, relative error {relative_error.item():.2e}")
              except RuntimeError as error:
                  print(f"{label}: failed: {error}")
          kernel = mx.fast.metal_kernel(
              name="probe_add_one",
              input_names=["values"],
              output_names=["result"],
              source="uint index = thread_position_in_grid.x; result[index] = values[index] + 1;",
          )
          result = kernel(
              inputs=[mx.arange(8, dtype=mx.float32)],
              grid=(8, 1, 1),
              threadgroup=(8, 1, 1),
              output_shapes=[(8,)],
              output_dtypes=[mx.float32],
          )[0]
          print(f"metal_kernel: {result.tolist()}")
          EOF
          # The empty name keeps the architecture the VM reports; a run that hangs the GPU is stopped after 300 s so the next one still runs.
          for gpu_architecture in "" applegpu_g16s applegpu_g17s; do
            echo "=== MLX_METAL_GPU_ARCH=${gpu_architecture:-<reported>}"
            MLX_METAL_GPU_ARCH="${gpu_architecture}" perl -e 'alarm shift; exec @ARGV' 300 "${RUNNER_TEMP}/probe-venv/bin/python" "${RUNNER_TEMP}/mlx_probe.py"
            echo "exit status $?"
          done

      - name: Download speed from Hugging Face
        run: |
          # Qwen3-ASR-0.6B-4bit's weights (0.7 GB) at the revision models.json pins.
          url=https://huggingface.co/mlx-community/Qwen3-ASR-0.6B-4bit/resolve/313d850181767edf09f00a9c289becca70e58cd0/model.safetensors
          curl -L -s -o /dev/null --max-time 90 -w '%{size_download} %{time_total}\n' "${url}" | awk '{printf "%.0f MB in %.1f s: %.1f MB/s\n", $1 / 1e6, $2, $1 / 1e6 / $2}'
