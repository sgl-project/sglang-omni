name: Cleanup PR CI Home On Close

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-pr-ci-home:
    name: cleanup - PR CI home on close
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: hongccc/sglang-omni@sha256:02a85f00438c901c72a2eb2ef738974a807f63af3d13084445604f3344067b19
      options: --rm -e NVIDIA_VISIBLE_DEVICES -e OMNI_CI_CPUSET -v /dev/shm:/dev/shm -v /data/omni-ci:/data/omni-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove PR CI home
        shell: bash
        run: |
          bash .github/scripts/cleanup_ci_pr_home.sh \
            "/data/omni-ci/pr-${{ github.event.pull_request.number }}"
