name: Cleanup PR CI Home On Close

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-pr-ci-home:
    name: cleanup - PR CI home on close
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: hongccc/sglang-omni@sha256:374d0b1c30b2bff685b1716fc64a02ad3b3d0a90fe2ce73ce9861a6992c28101
      options: --rm -e NVIDIA_VISIBLE_DEVICES -v /dev/shm:/dev/shm -v /data/omni-ci:/data/omni-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove PR CI home
        shell: bash
        run: |
          bash .github/scripts/cleanup_ci_pr_home.sh \
            "/data/omni-ci/pr-${{ github.event.pull_request.number }}"
