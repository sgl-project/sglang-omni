name: TTS CI

on:
  workflow_call:
    inputs:
      tts_ci_model:
        description: TTS CI model preset selected by the parent omni-ci preflight.
        type: string
        default: higgs
      omni_ci_home:
        description: PR-scoped CI home from the parent omni-ci workflow.
        type: string
        required: false
        default: ""

env:
  OMNI_CI_HOME: >-
    ${{ inputs.omni_ci_home != ''
        && inputs.omni_ci_home
        || format('/data/omni-ci/run-{0}', github.run_id) }}

# Invoked by omni-ci.yaml after ASR CI. Restores omni only.
# DAG:
#   stage-1-non-streaming -> stage-2-streaming -> stage-3-consistency
#     -> stage-4-serving
# The MPS validation runs separately in test-mps-ci.yaml.

jobs:
  stage-1-non-streaming:
    name: stage 1 - non-streaming
    runs-on: [self-hosted, h100]
    timeout-minutes: 25
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Prepare speaker similarity assets
        shell: bash
        run: |
          source omni/bin/activate
          python -m benchmarks.metrics.speaker_similarity_assets --warm-cache
        env:
          HF_ENDPOINT: https://huggingface.co
          SEEDTTS_SIM_CACHE_DIR: /github/home/seedtts-wavlm-sim

      - name: Run TTS non-streaming benchmark stage
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_ci.py -v -s -x --concurrency 16 --tts-stage tts-stage-1-nonstream
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEEDTTS_SIM_CACHE_DIR: /github/home/seedtts-wavlm-sim
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE_OUTPUT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Upload non-streaming speed artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: tts-stage-nonstream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}/**/speed_results.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 1 (non-streaming)
          artifact-search-root: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          artifact-path-globs: |
            */speed_results.json
            */wer_results.json
            */similarity_results.json

  stage-2-streaming:
    name: stage 2 - streaming
    needs: stage-1-non-streaming
    if: always() && !cancelled()
    runs-on: [self-hosted, h100]
    timeout-minutes: 25
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run TTS streaming benchmark stage
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_ci.py -v -s -x --concurrency 16 --tts-stage tts-stage-2-stream
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE_OUTPUT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Upload streaming speed artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: tts-stage-stream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}/**/speed_results.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 2 (streaming)
          artifact-search-root: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          artifact-path-globs: |
            */speed_results.json
            */wer_results.json

  stage-latency:
    name: stage latency - streaming first audio
    needs: stage-2-streaming
    if: always() && !cancelled() && startsWith(inputs.tts_ci_model, 'qwen3-tts')
    runs-on: [self-hosted, h100]
    timeout-minutes: 30
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run TTS streaming first-audio latency stage
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_latency_ci.py -v -s -x
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OMNI_CI_MAX_ATTEMPTS: "1"
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE_OUTPUT_ROOT: >-
            ${{ env.OMNI_CI_HOME }}/tts-stage-results/latency/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      # note (luojiaxuan): a run that trips a gate is the one whose numbers
      # matter, so this uploads after a failure too; the run and attempt keyed
      # root keeps an earlier push's results out of it. Missing files are an
      # error only when the stage passed.
      - name: Upload latency artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tts-stage-latency-results
          path: >-
            ${{ env.OMNI_CI_HOME }}/tts-stage-results/latency/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}/**/speed_results.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 30
          overwrite: true

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage latency (streaming first audio)
          artifact-search-root: >-
            ${{ env.OMNI_CI_HOME }}/tts-stage-results/latency/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          artifact-path-globs: |
            */speed_results.json

  stage-3-consistency:
    name: stage 3 - consistency
    needs: stage-2-streaming
    if: always() && !cancelled()
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Download non-streaming speed artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-stage-nonstream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}

      - name: Download streaming speed artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-stage-stream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}

      - name: Run consistency check
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_consistency_artifacts.py -v -s -x
        env:
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE1_SPEED_RESULTS_DIR: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          TTS_STAGE2_SPEED_RESULTS_DIR: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          TTS_CONSISTENCY_CONCURRENCY: "16"

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 3 (consistency)

  stage-4-serving:
    name: stage 4 - serving stress
    needs: stage-3-consistency
    if: always() && !cancelled()
    runs-on: [self-hosted, h100]
    timeout-minutes: 75
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run TTS serving stress stage through router DP2
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_serving_ci.py -v -s -x
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TTS_SERVING_STAGE_OUTPUT_ROOT: >-
            ${{ env.OMNI_CI_HOME }}/tts-stage-results/serving/run-attempt-${{ github.run_attempt }}
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 4 (serving stress)
          artifact-search-root: >-
            ${{ env.OMNI_CI_HOME }}/tts-stage-results/serving/run-attempt-${{ github.run_attempt }}
          artifact-path-globs: |
            */benchmark/results.json
            */benchmark/manifest.json
            */benchmark.wall_time.json
            */benchmark_validation.json
            */router_validation.json
            */cleanup_validation.json
          artifact-upload-name: tts-stage-serving-results
          artifact-upload-path: >-
            ${{ env.OMNI_CI_HOME }}/tts-stage-results/serving/run-attempt-${{ github.run_attempt }}
          artifact-if-no-files-found: error
          summary-only: "true"
