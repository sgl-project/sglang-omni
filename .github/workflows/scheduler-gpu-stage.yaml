name: Scheduler GPU Stage

on:
  workflow_dispatch:
    inputs:
      queue_item_id:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      stage_id:
        required: true
        type: string
      check_run_id:
        required: false
        type: string
        default: ""

run-name: scheduler-stage queue-item-${{ inputs.queue_item_id }} ${{ inputs.stage_id }}

permissions:
  contents: read

env:
  OMNI_CI_HOME: /github/home/pr-${{ inputs.pr_number }}
  OMNI_VENV_NAME: omni
  TTS_MODEL_PATH: boson-sglang/higgs-audio-v3-TTS-4B-grpo05200410999
  QWEN3_ASR_MODEL_PATH: Qwen/Qwen3-ASR-1.7B

jobs:
  run-stage:
    name: ${{ inputs.stage_id }}
    runs-on: [self-hosted]
    timeout-minutes: 60
    container:
      image: frankleeeee/sglang-omni:dev
      options: >-
        --gpus all --rm
        -v /dev/shm:/dev/shm
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni
          install-deps: "true"

      - uses: ./.github/actions/omni-save-cache
        with:
          venv-name: omni

      - name: Report stage started
        if: ${{ vars.CI_SCHEDULER_CALLBACK_URL != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ vars.CI_SCHEDULER_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CI_SCHEDULER_CALLBACK_TOKEN }}
        run: |
          curl -fsS -X POST "${CALLBACK_URL}/callbacks/stage" \
            -H "Authorization: Bearer ${CALLBACK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"queue_item_id\":${{ inputs.queue_item_id }},\"status\":\"running\",\"workflow_run_id\":${{ github.run_id }}}"

      - name: Run selected stage
        shell: bash
        env:
          HF_ENDPOINT: https://hf-mirror.com
          HF_TOKEN: ${{ secrets.BOSON_HF_TOKEN }}
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_ENABLE_HF_TRANSFER: "0"
          QWEN3_ASR_CI_CONCURRENCY: "2"
          QWEN3_ASR_MODEL_PATH: ${{ env.QWEN3_ASR_MODEL_PATH }}
          TTS_STAGE_OUTPUT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results
          SGLANG_SEEDTTS50_DIR: /github/home/seedtts-50
          SEEDTTS_SIM_CACHE_DIR: /github/home/seedtts-wavlm-sim
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor
        run: |
          python ci-scheduler/tools/run_stage.py --stage-id "${{ inputs.stage_id }}"

      - name: Report stage succeeded
        if: ${{ success() && vars.CI_SCHEDULER_CALLBACK_URL != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ vars.CI_SCHEDULER_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CI_SCHEDULER_CALLBACK_TOKEN }}
        run: |
          curl -fsS -X POST "${CALLBACK_URL}/callbacks/stage" \
            -H "Authorization: Bearer ${CALLBACK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"queue_item_id\":${{ inputs.queue_item_id }},\"status\":\"passed\",\"workflow_run_id\":${{ github.run_id }}}"

      - name: Report stage failed
        if: ${{ failure() && vars.CI_SCHEDULER_CALLBACK_URL != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ vars.CI_SCHEDULER_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CI_SCHEDULER_CALLBACK_TOKEN }}
        run: |
          curl -fsS -X POST "${CALLBACK_URL}/callbacks/stage" \
            -H "Authorization: Bearer ${CALLBACK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"queue_item_id\":${{ inputs.queue_item_id }},\"status\":\"failed\",\"workflow_run_id\":${{ github.run_id }}}"
