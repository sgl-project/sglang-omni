name: Suggest CI stages

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose suggestion comment to refresh
        required: true
        type: number

permissions: {}

# Every refresh of one pull request waits for the one before it, so two never write at once.
concurrency:
  group: ci-stage-suggestion-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # SECURITY: pull_request_target runs with a write token. The default checkout is
      # the base branch, so only trusted code runs. Never check out the pull request here.
      - name: Checkout the base branch
        uses: actions/checkout@v4

      - name: Update the stage suggestion comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
        run: python scripts/ci/utils/suggest_ci_stages.py
