name: Docs Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get install -y pandoc parallel retry
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          make compile
          make html

      - name: Add .nojekyll file
        run: |
          touch ./docs/_build/html/.nojekyll

      - name: Build TTS refactor dashboard
        run: |
          python3 scripts/refactor_net_deletions.py \
            --base '4e4c98a^1' \
            --head HEAD \
            --mode commit-sum \
            --commit-file scripts/tts_refactor_commits.json \
            --format html \
            --output docs/_build/html/tts-refactor/index.html \
            --title 'TTS Refactor Progress' \
            --refresh-seconds 300 \
            --scope-note 'Counts only merge commits in scripts/tts_refactor_commits.json. Model integrations #858 and #1112 and unrelated main commits are excluded.' \
            --list-test-files \
            --list-non-test-files

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
