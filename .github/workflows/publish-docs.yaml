name: Docs Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Docs Preview pushes to gh-pages too; one push at a time.
    concurrency:
      group: gh-pages-branch
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Note (Akazaakane): The third-party Chrome repo is unnecessary for docs builds.
          sudo find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -qE 'https?://dl\.google\.com/linux/chrome(-stable)?/deb([/[:space:]]|$)' {} \; \
            -delete

          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get install -y --no-install-recommends pandoc parallel retry
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          make compile
          make html

      - name: Add .nojekyll file
        run: |
          touch ./docs/_build/html/.nojekyll

      # The deploy replaces the whole branch, so carry the pull request
      # previews that Docs Preview keeps under pr-preview/ into the new build.
      - name: Keep the pull request previews
        run: |
          git fetch --depth=1 origin gh-pages
          if git cat-file -e origin/gh-pages:pr-preview 2>/dev/null; then
            git archive origin/gh-pages pr-preview | tar -x -C ./docs/_build/html
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
