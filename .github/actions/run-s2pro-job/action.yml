name: Run S2-Pro Job
description: Restore the prepared S2-Pro environment and run a single S2-Pro CI job.

inputs:
  job-title:
    description: Label used in log output.
    required: true
  pytest-command:
    description: Pytest command to execute.
    required: true
  print-benchmark-artifacts:
    description: Whether to print benchmark JSON outputs from /tmp.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore cache
      shell: bash
      run: |
        if [ -d /github/home/omni-s2pro ] && [ ! -z "$(ls -A /github/home/omni-s2pro/)" ]; then
          cp -p -r /github/home/omni-s2pro ./omni-s2pro
        fi

    - name: Verify prepared environment
      shell: bash
      run: |
        test -x omni-s2pro/bin/python
        source omni-s2pro/bin/activate
        python -c "import torch"

    - name: Remove flashinfer
      shell: bash
      run: |
        rm -rf /github/home/.cache/flashinfer

    - name: Kill GPU processes
      shell: bash
      run: |
        bash .github/scripts/delete_gpu_process.sh

    - name: Run pytest
      shell: bash
      run: |
        source omni-s2pro/bin/activate
        export PYTHONPATH=$PWD
        ${{ inputs.pytest-command }}
      env:
        HF_ENDPOINT: https://hf-mirror.com

    - name: Print benchmark artifacts
      if: ${{ always() && inputs.print-benchmark-artifacts == 'true' }}
      shell: bash
      run: |
        echo "=== ${{ inputs.job-title }} results ==="
        for f in $(find /tmp -name "speed_results.json" -o -name "wer_results.json" 2>/dev/null); do
          echo "--- $f ---"
          cat "$f"
          echo ""
        done

    - name: Kill GPU processes
      if: ${{ always() }}
      shell: bash
      run: |
        bash .github/scripts/delete_gpu_process.sh
