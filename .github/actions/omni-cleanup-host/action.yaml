name: Omni Cleanup Host
description: >
  Reclaim self-hosted SSD space after a CI workflow by removing published
  virtualenv caches and ephemeral compile directories. HuggingFace model
  weights and ModelScope model caches are preserved; HF datasets are untouched.

inputs:
  venv-names:
    description: >
      Space-separated virtualenv names to remove from /github/home/. When empty,
      removes all known Omni CI venvs (omni, omni-qwen3, omni-s2pro).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cleanup host cache
      shell: bash
      run: bash .github/scripts/cleanup_ci_host_cache.sh ${{ inputs.venv-names }}
