name: Omni Save Cache
description: >
  Validate the prepared Omni virtualenv published under /github/home/.
  The venv is installed in place on the host; this step does not copy files.

inputs:
  venv-name:
    description: Name of the virtualenv directory under /github/home/.
    required: true

runs:
  using: composite
  steps:
    - name: Validate host venv cache
      shell: bash
      run: bash .github/scripts/validate_omni_venv_cache.sh "${{ inputs.venv-name }}"
