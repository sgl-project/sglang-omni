name: Omni CI Setup
description: Restore a prepared Omni virtualenv and run common pre-test setup.

inputs:
  venv-name:
    description: Name of the virtualenv to restore and activate.
    required: true
  install-deps:
    description: Prepare or refresh the requested virtualenv before running tests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate PR-scoped CI home
      shell: bash
      run: bash .github/scripts/validate_omni_ci_home.sh

    - name: Align CI cache home
      shell: bash
      run: |
        echo "HOME=/github/home" >> "${GITHUB_ENV}"
        echo "HF_HOME=/github/home/.cache/huggingface" >> "${GITHUB_ENV}"
        echo "XDG_CACHE_HOME=${OMNI_CI_HOME}/.cache" >> "${GITHUB_ENV}"
        # FlashInfer does not use XDG_CACHE_HOME. Its JIT cache must survive
        # the job container: on a miss it recompiles cutlass kernels for
        # minutes at full host width, and under /root that work dies with the
        # container, so every job on the runner pays it again (#1296). Seed
        # the persistent CI home from the image's prewarmed cache once, then
        # keep the workspace there. The copy and rename keep a concurrent
        # sibling job from seeing a half-seeded cache.
        if [ ! -d "${OMNI_CI_HOME}/.cache/flashinfer" ] && [ -d /root/.cache/flashinfer ]; then
          mkdir -p "${OMNI_CI_HOME}/.cache"
          # mktemp: $$ is not unique across job containers (separate PID
          # namespaces share this mount), and a cancelled cp must never leave
          # a staging dir a later job could republish.
          seed="$(mktemp -d "${OMNI_CI_HOME}/.cache/.flashinfer-seed.XXXXXXXX")"
          if cp -a /root/.cache/flashinfer/. "${seed}/" \
              && mv -T "${seed}" "${OMNI_CI_HOME}/.cache/flashinfer" 2>/dev/null; then
            echo "Seeded FlashInfer JIT cache into ${OMNI_CI_HOME}/.cache/flashinfer"
          fi
          rm -rf "${seed}"
        fi
        echo "FLASHINFER_WORKSPACE_BASE=${OMNI_CI_HOME}" >> "${GITHUB_ENV}"
        echo "HF_HUB_DISABLE_XET=0" >> "${GITHUB_ENV}"
        echo "HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}" >> "${GITHUB_ENV}"
        # PyPI mirror + shared wheel cache (HF mirror does not accelerate pip/uv).
        echo "UV_INDEX_URL=${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}" >> "${GITHUB_ENV}"
        # uv cache and the uv-managed CPython interpreter must live on the
        # persistent /data/omni-ci mount: the venv's bin/python is a symlink into
        # UV_PYTHON_INSTALL_DIR, so if that dir sat under /github/home (wiped every
        # job by the runner) the reused venv would break with "python not found".
        echo "UV_CACHE_DIR=/data/omni-ci/uv-cache" >> "${GITHUB_ENV}"
        echo "UV_PYTHON_INSTALL_DIR=/data/omni-ci/uv-python" >> "${GITHUB_ENV}"

    - name: Restore cache
      shell: bash
      env:
        VENV_NAME: ${{ inputs.venv-name }}
      run: |
        HOST="${OMNI_CI_HOME}/${VENV_NAME}"
        if [ -d "${HOST}" ] && [ -n "$(ls -A "${HOST}/")" ]; then
          rm -rf "./${VENV_NAME}"
          ln -sfn "${HOST}" "./${VENV_NAME}"
        fi

    - name: Reconcile or install dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      env:
        VENV_NAME: ${{ inputs.venv-name }}
      run: bash .github/scripts/reconcile_omni_ci_env.sh "${VENV_NAME}"

    - name: Validate or recover prepared environment
      if: ${{ inputs.install-deps != 'true' }}
      shell: bash
      env:
        VENV_NAME: ${{ inputs.venv-name }}
      run: |
        if bash .github/scripts/validate_omni_env_reusable.sh "${VENV_NAME}"; then
          echo "Prepared ${VENV_NAME} environment is reusable under ${OMNI_CI_HOME}."
          exit 0
        fi

        echo "::warning::Prepared ${VENV_NAME} environment is missing or drifted under ${OMNI_CI_HOME}; rebuilding."
        bash .github/scripts/reconcile_omni_ci_env.sh "${VENV_NAME}"

    - name: Assert OMNI environment passes reuse gate
      shell: bash
      env:
        VENV_NAME: ${{ inputs.venv-name }}
      run: bash .github/scripts/validate_omni_env_reusable.sh "${VENV_NAME}"

    - name: Kill GPU processes
      shell: bash
      run: |
        bash .github/scripts/delete_gpu_process.sh
