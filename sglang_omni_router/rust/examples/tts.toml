# Two replicas serving encoded and streaming speech.
schema_version = 1

[server]
listen = "0.0.0.0:30000"
max_connections = 1024

[shutdown]
drain_timeout_ms = 30000

[logging]
format = "json"
filter = "info"

[router]
strategy = "round_robin"

[admission]
global = 64
speech_http = 32

[health]
interval_ms = 5000
timeout_ms = 5000
success_threshold = 2
failure_threshold = 3

[http]
buffered_request_total_bytes = 268435456
connect_timeout_ms = 5000
pool_idle_timeout_ms = 90000
pool_max_idle_per_host = 8

[http_media]
routes = ["speech"]
trust_domain = "local"
buffered_request_max_bytes = 8388608
streamed_request_max_bytes = 536870912
request_timeout_ms = 1800000

[[workers]]
worker_id = "tts-1"
base_url = "http://127.0.0.1:8100/"
trust_domain = "local"
default_model_id = "tts-model"
health_path = "/health"

[[workers.service_profiles]]
service = "speech_http"
model_ids = ["tts-model"]
response_formats = ["mp3", "opus", "aac", "flac", "wav"]
stream_modes = ["non_streaming"]
tasks = ["text_to_speech"]
reference_forms = ["none"]
voice_name_policy = "preset"

[[workers.service_profiles]]
service = "speech_http"
model_ids = ["tts-model"]
response_formats = ["pcm"]
stream_modes = ["non_streaming", "streaming"]
tasks = ["text_to_speech"]
reference_forms = ["none"]
voice_name_policy = "preset"

[[workers]]
worker_id = "tts-2"
base_url = "http://127.0.0.1:8101/"
trust_domain = "local"
default_model_id = "tts-model"
health_path = "/health"

[[workers.service_profiles]]
service = "speech_http"
model_ids = ["tts-model"]
response_formats = ["mp3", "opus", "aac", "flac", "wav"]
stream_modes = ["non_streaming"]
tasks = ["text_to_speech"]
reference_forms = ["none"]
voice_name_policy = "preset"

[[workers.service_profiles]]
service = "speech_http"
model_ids = ["tts-model"]
response_formats = ["pcm"]
stream_modes = ["non_streaming", "streaming"]
tasks = ["text_to_speech"]
reference_forms = ["none"]
voice_name_policy = "preset"
