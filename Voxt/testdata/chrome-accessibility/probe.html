<!doctype html><meta charset="utf-8"><title>Voxt Chrome native verification</title>
<style>body{font:15px system-ui;margin:28px;background:#f5f5f5;color:#181818}button,input,select{font:inherit;padding:9px}#status{font-weight:600}table{border-collapse:collapse;background:white;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}#rows{height:330px;overflow:auto;background:white;margin-top:16px}article{display:grid;grid-template-columns:70px 1fr 130px;padding:5px 12px;border-bottom:1px solid #eee}#marker{position:fixed;right:30px;top:40px;width:12px;height:12px;background:#1860da;border-radius:50%}pre{white-space:pre-wrap}</style>
<h1>Voxt · Chrome native verification</h1><p>Local synthetic page. No microphone, camera, login, or remote requests.</p>
<p id="status">Preparing…</p><button id="run">Run comparison</button> <input id="typing" aria-label="Typing response test" placeholder="Typing response test"><span id="echo"></span>
<table><thead><tr><th>Rows / phase</th><th>Frames</th><th>Frame median / p95</th><th>&gt;33ms</th><th>Browser CPU</th><th>RSS sum</th><th>Enhanced AX</th></tr></thead><tbody id="results"></tbody></table><div id="marker"></div><div id="rows"></div><pre id="details"></pre>
<script>
const q=new URLSearchParams(location.search), tag=q.get('tag')||'current';
const state={running:false,inputFrames:[]};
const api=async(path,data)=>{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,tag})});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j};
document.querySelector('#typing').addEventListener('input',e=>{const t=performance.now();document.querySelector('#echo').textContent=e.target.value;requestAnimationFrame(()=>{state.inputFrames.push(performance.now()-t);fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag,ms:state.inputFrames.at(-1)})})})});
function populate(n){const f=document.createDocumentFragment();for(let i=0;i<n;i++){let a=document.createElement('article');a.innerHTML=`<span>${i+1}</span><span>Local synthetic document paragraph ${i+1}: meeting notes and editing response.</span><span class="v">0</span>`;f.appendChild(a)}document.querySelector('#rows').replaceChildren(f)}
const quant=(a,p)=>a[Math.min(a.length-1,Math.floor(a.length*p))]||0;
async function sample(count,phase,rep){document.querySelector('#status').textContent=`Running ${count} rows · ${phase} · repeat ${rep+1}`;const start=await api('/begin',{count,phase,rep});let deltas=[],last=0,frames=0;const cells=[...document.querySelectorAll('.v')], t0=performance.now();await new Promise(resolve=>{function frame(t){if(last)deltas.push(t-last);last=t;for(let j=0;j<24;j++)cells[(frames*17+j*31)%cells.length].textContent=`${frames+j}`;document.querySelector('#marker').style.transform=`translateY(${Math.sin(t/500)*20}px)`;frames++;if(t-t0>=6000)resolve();else requestAnimationFrame(frame)}requestAnimationFrame(frame)});deltas.sort((a,b)=>a-b);const result=await api('/finish',{count,phase,rep,frames,frameMedian:quant(deltas,.5),frameP95:quant(deltas,.95),longFramePercent:100*deltas.filter(t=>t>33.34).length/deltas.length,duration:performance.now()-t0,visibility:document.visibilityState});const tr=document.createElement('tr');tr.innerHTML=`<td>${count} / ${phase} #${rep+1}</td><td>${frames}</td><td>${result.frameMedian.toFixed(2)} / ${result.frameP95.toFixed(2)} ms</td><td>${result.longFramePercent.toFixed(1)}%</td><td>${result.browserCPU.toFixed(2)}%</td><td>${result.rssMiB.toFixed(1)} MiB</td><td>${JSON.stringify(result.ax)}</td>`;document.querySelector('#results').appendChild(tr)}
async function run(){if(state.running)return;state.running=true;document.querySelector('#run').disabled=true;try{await api('/initialize',{});for(const count of [1000,10000]){populate(count);for(let rep=0;rep<3;rep++){for(const phase of ['baseline','active','released']){await api('/mode',{phase});await sample(count,phase,rep)}}}await api('/mode',{phase:'released'});const all=await api('/summary',{});document.querySelector('#status').textContent='Comparison complete — helper released';document.querySelector('#details').textContent=JSON.stringify(all,null,2)}catch(e){document.querySelector('#status').textContent='FAILED: '+e.message;await api('/mode',{phase:'released'}).catch(()=>{})}finally{state.running=false;document.querySelector('#run').disabled=false}}
document.querySelector('#run').onclick=run;
api('/hello',{}).then(j=>{document.querySelector('#status').textContent=`Ready · ${tag} · target PID ${j.pid}`;if(q.get('auto')==='1')run()}).catch(e=>document.querySelector('#status').textContent='FAILED: '+e.message);
</script>

<script>if(q.get('window')==='1'){document.querySelector('#run').hidden=true;document.querySelector('#rows').hidden=true;for(const phase of ['baseline','active','released']){const b=document.createElement('button');b.textContent='Window test: '+phase;b.onclick=async()=>{document.querySelector('#status').textContent='Changing to '+phase;try{const r=await api('/mode',{phase});document.querySelector('#status').textContent='Window test ready: '+phase;document.querySelector('#details').textContent=JSON.stringify(r,null,2)}catch(e){document.querySelector('#status').textContent='FAILED: '+e.message}};document.querySelector('#typing').before(b)}document.title='Voxt Chrome window verification'}</script>
