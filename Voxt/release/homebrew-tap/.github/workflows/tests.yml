name: Cask checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew trust zhaochenyang20/voxt
      - run: brew style --cask zhaochenyang20/voxt/voxt
      - run: brew audit --cask --strict --online zhaochenyang20/voxt/voxt
      - run: brew livecheck --cask zhaochenyang20/voxt/voxt
