# The iOS app's Xcode project, generated by XcodeGen (the .xcodeproj is
# not committed):
#
#   brew install xcodegen
#   cd Voxt/ios/App && xcodegen && open Voxt.xcodeproj
#
# The pre-build step builds the Go core for the SDK being built
# (../scripts/build-core.sh xcode); the linker finds it by SDK below.
name: Voxt
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  VoxtKit:
    path: ../VoxtKit
targets:
  Voxt:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VoxtKit
        product: VoxtUI
      - package: VoxtKit
        product: VoxtKit
    preBuildScripts:
      - name: Build the Go core
        script: exec "$SRCROOT/../scripts/build-core.sh" xcode
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Voxt
        PRODUCT_BUNDLE_IDENTIFIER: dev.hehehai.voxtnew.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO # the pre-build step writes ../build
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Voxt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Voxt records your voice to transcribe, translate or rewrite it.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Voxt recognises your speech with Apple's speech recognition, on this iPhone when you choose so.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(inherited) $(SRCROOT)/../build/iphoneos
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(inherited) $(SRCROOT)/../build/iphonesimulator
        # The Go core is built for arm64 only: the simulator on Apple silicon.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    scheme:
      testTargets:
        - VoxtUITests
  # Drives the app in the simulator against a fake server (see the file).
  VoxtUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Voxt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hehehai.voxtnew.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
