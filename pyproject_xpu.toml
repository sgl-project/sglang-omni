[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-omni"
version = "0.1.0+xpu1"
description = "MOSS-Transcribe-Diarize serving on the SGLang Intel XPU backend"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx",
    "huggingface-hub>=0.36.0",
    "msgpack>=1.0.0",
    "numpy>=1.24.0",
    "pybase64>=1.4.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pyzmq>=25.0.0",
    "safetensors>=0.4.3",
    "soundfile>=0.12.0",
    "transformers==5.6.0",
    "typer>=0.9.0",
    "uvicorn>=0.23.0",
    "xxhash>=3.0.0",
]

[project.scripts]
sgl-omni = "sglang_omni.cli:app"
sgl-omni-router = "sglang_omni_router.serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sglang_omni*"]

[tool.setuptools.package-data]
"sglang_omni.models.fishaudio_s2_pro" = ["fish_speech/configs/*.yaml"]
"sglang_omni.models.higgs_tts" = ["_vendored/*.json"]
