<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/static/orb/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duplex Live</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --border: rgba(28, 36, 32, .09);
      --text: #1d2420;
      --muted: #6b746f;
      --faint: #a3aaa6;
      --accent: #3f8f86;
      --danger: #d9534f;
      --warning: #a8641a;
      --btn: rgba(28, 36, 32, .055);
      --btn-hover: rgba(28, 36, 32, .10);
      --primary: #1f2723;
      --primary-text: #f7f7f4;
      --shadow: 0 12px 32px rgba(28, 36, 32, .10);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121513; --surface: #1b1f1d; --border: rgba(232, 238, 234, .08); --text: #e9ede9; --muted: #98a19c; --faint: #5d6661;
        --accent: #7cc4ba; --danger: #e5645f; --warning: #e0a458; --btn: rgba(232, 238, 234, .07); --btn-hover: rgba(232, 238, 234, .13);
        --primary: #e9ede9; --primary-text: #121513; --shadow: 0 12px 32px rgba(0, 0, 0, .45);
      }
    }
    :root[data-theme="dark"] {
      --bg: #121513; --surface: #1b1f1d; --border: rgba(232, 238, 234, .08); --text: #e9ede9; --muted: #98a19c; --faint: #5d6661;
      --accent: #7cc4ba; --danger: #e5645f; --warning: #e0a458; --btn: rgba(232, 238, 234, .07); --btn-hover: rgba(232, 238, 234, .13);
      --primary: #e9ede9; --primary-text: #121513; --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; overflow: hidden;
      -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .orb:focus-visible { outline-offset: 8px; }

    /* Top bar */
    .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: max(18px, env(safe-area-inset-top)) 24px 8px; }
    .brand { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
    .brand span { color: var(--faint); font-weight: 450; margin-left: 6px; }
    .brand .brand-name { color: var(--text); font-weight: 600; margin-left: 0; }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .status[data-state="live"] i { background: #3fb67a; }
    .status[data-state="busy"] i { background: var(--warning); }
    .status[data-state="error"] i { background: var(--danger); }
    .status[data-state="connecting"] i { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .top-actions { display: flex; justify-content: flex-end; gap: 4px; }
    .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
    .icon-btn:hover { background: var(--btn); color: var(--text); }
    .icon-btn svg { width: 19px; height: 19px; }

    /* Stage */
    .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 8px 16px; min-height: 0; }
    .orb { position: relative; width: min(58vw, 38dvh, 280px); aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
    .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    /* CSS fallback when WebGL is unavailable. */
    .orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(180deg, #edf3f0 0 45%, #74b3ab 60%, #3f7f7e 100%); }
    .orb.has-gl::before { display: none; }
    .status-line { min-height: 1.3em; color: var(--muted); font-size: .9rem; text-align: center; }
    .caption {
      width: min(560px, 100%); min-height: 3.3em; margin: -12px 0 0; color: var(--text); font-size: 1.05rem; line-height: 1.65; text-align: center;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: opacity 500ms ease;
    }
    .caption[data-fade="true"] { opacity: .3; }
    .warning {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 32px));
      padding: 10px 14px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border);
      color: var(--warning); font-size: .86rem; line-height: 1.45; text-align: center; z-index: 3;
    }

    /* Camera self view */
    .self-view { position: absolute; top: 4px; right: 24px; width: min(26vw, 150px); aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: #000; box-shadow: var(--shadow); z-index: 2; }
    .self-view video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .self-view span { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0, 0, 0, .5); color: #fff; font-size: .68rem; font-variant-numeric: tabular-nums; }

    /* Dock */
    .dock-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 16px max(28px, env(safe-area-inset-bottom)); }
    .dock { display: flex; align-items: center; gap: 16px; }
    .dock-btn { width: 52px; height: 52px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--btn); color: var(--text); cursor: pointer; transition: background 150ms, transform 150ms, opacity 150ms; touch-action: manipulation; }
    .dock-btn svg { width: 20px; height: 20px; }
    .dock-btn:hover:not(:disabled) { background: var(--btn-hover); }
    .dock-btn:active:not(:disabled) { transform: scale(.94); }
    .dock-btn:disabled { opacity: .3; cursor: not-allowed; }
    .dock-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); }
    .dock-btn.end { background: var(--danger); color: #fff; }
    .start-btn { height: 52px; padding: 0 30px; border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-text); font-weight: 550; font-size: .98rem; cursor: pointer; touch-action: manipulation; transition: transform 150ms, opacity 150ms; }
    .start-btn:active:not(:disabled) { transform: scale(.97); }
    .start-btn:disabled { opacity: .35; cursor: not-allowed; }
    .note { max-width: 440px; margin: 0; color: var(--faint); font-size: .76rem; line-height: 1.55; text-align: center; }
    .hint { color: var(--faint); font-size: .76rem; min-height: 1em; }

    /* Settings panel */
    .panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); display: flex; flex-direction: column;
      background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 6;
      transform: translateX(105%); visibility: hidden; transition: transform 300ms cubic-bezier(.2, .8, .2, 1), visibility 0s 300ms;
    }
    .panel[data-open="true"] { transform: none; visibility: visible; transition-delay: 0s; }
    .panel header { display: flex; align-items: center; justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 12px 8px 22px; font-size: .95rem; font-weight: 600; }
    .panel form { flex: 1; overflow-y: auto; padding: 4px 22px max(22px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; color: var(--muted); }
    .field.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
    .field select, .field textarea, .field input[type="number"] {
      font: inherit; font-size: .88rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; width: 100%;
    }
    .field.inline input[type="number"] { width: 110px; }
    .field textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
    .field .hint { color: var(--faint); font-size: .74rem; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row select { flex: 1; }
    .text-btn { border: 1px solid var(--border); background: var(--btn); color: var(--text); border-radius: 10px; padding: 7px 12px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
    .text-btn:hover:not(:disabled) { background: var(--btn-hover); }
    .panel details summary { cursor: pointer; font-size: .82rem; color: var(--muted); }
    .panel details[open] summary { margin-bottom: 10px; }
    .panel details > div { display: flex; flex-direction: column; gap: 10px; }
    .locked-note { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--btn); color: var(--muted); font-size: .78rem; }
    .panel :disabled { opacity: .55; cursor: not-allowed; }

    /* Transcript sheet */
    .sheet {
      position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 105%); width: min(640px, 100%); max-height: 68dvh;
      display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-bottom: 0;
      border-radius: 20px 20px 0 0; box-shadow: var(--shadow); z-index: 5;
      visibility: hidden; transition: transform 300ms cubic-bezier(.2, .8, .2, 1), visibility 0s 300ms;
    }
    .sheet[data-open="true"] { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }
    .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 6px 22px; font-size: .9rem; font-weight: 600; }
    .sheet .transcript { overflow-y: auto; padding: 0 22px max(22px, env(safe-area-inset-bottom)); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
    .transcript .empty { color: var(--faint); }
    .transcript p { margin: 0 0 12px; }
    @media (max-width: 480px) {
      .topbar { padding-left: 16px; padding-right: 12px; }
      .brand span:not(.brand-name) { display: none; }
      .dock { gap: 12px; }
      .self-view { width: 84px; right: 12px; border-radius: 12px; }
      .self-view span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span id="brandName" class="brand-name">Voice</span><span>full duplex · sglang-omni</span></div>
    <div id="statusPill" class="status" data-state="idle" role="status" aria-live="polite"><i></i><span id="statusText">checking…</span></div>
    <div class="top-actions">
      <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-controls="settingsPanel" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button id="transcriptBtn" class="icon-btn" type="button" title="Transcript" aria-label="Show transcript" aria-controls="sheet" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button id="traceBtn" class="icon-btn" type="button" title="Download trace" aria-label="Download the last session's trace" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div id="warning" class="warning" role="alert" hidden></div>
    <div id="selfView" class="self-view" hidden>
      <video id="cameraPreview" muted playsinline autoplay aria-label="Camera preview"></video>
      <span id="frameCount"></span>
    </div>
    <button id="orb" class="orb" type="button" aria-label="Start conversation">
      <canvas id="orbCanvas" aria-hidden="true"></canvas>
    </button>
    <div id="statusLine" class="status-line" aria-live="polite"></div>
    <p id="caption" class="caption" aria-live="polite"></p>
  </main>

  <footer class="dock-wrap">
    <button id="startBtn" class="start-btn" type="button">
      Start talking
    </button>
    <div id="dock" class="dock" role="group" aria-label="Call controls" hidden>
      <button id="cameraBtn" class="dock-btn" type="button" aria-pressed="false" title="Turn camera on" aria-label="Turn camera on" hidden>
        <svg id="cameraOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M3 7.5h11a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 14 16.5H3A1.5 1.5 0 0 1 1.5 15V9A1.5 1.5 0 0 1 3 7.5z"/><path d="m15.5 11 6-3.5v9l-6-3.5z"/></svg>
        <svg id="cameraOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h11a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 14 16.5H3A1.5 1.5 0 0 1 1.5 15V9A1.5 1.5 0 0 1 3 7.5z"/><path d="m15.5 11 6-3.5v9l-6-3.5z"/><path d="M2 3l20 18"/></svg>
      </button>
      <button id="muteBtn" class="dock-btn" type="button" aria-pressed="false" title="Mute microphone" aria-label="Mute microphone">
        <svg id="micOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg id="micOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M15 10V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5 2.2M5 11a7 7 0 0 0 11.6 5.3M19 11a7 7 0 0 1-.5 2.6M12 18v3M3 3l18 18"/></svg>
      </button>
      <button id="interruptBtn" class="dock-btn" type="button" title="Stop the current answer" aria-label="Stop the current answer" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
      <button id="endBtn" class="dock-btn end" type="button" title="End" aria-label="End conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="hint" class="hint"></div>
    <p id="note" class="note">It listens while it speaks, so you can cut in just by talking. Use headphones and Chrome.</p>

  </footer>

  <aside id="settingsPanel" class="panel" data-open="false" aria-label="Settings">
    <header>
      <span>Settings</span>
      <button id="settingsClose" class="icon-btn" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <form id="settingsForm" onsubmit="return false">
      <p id="settingsLocked" class="locked-note" hidden>Settings apply when the next conversation starts.</p>
      <label id="presetRow" class="field">Preset<select id="setPreset"></select></label>
      <label class="field">System prompt<textarea id="setPrompt" rows="4" spellcheck="false"></textarea></label>
      <div id="voiceRow" class="field">Voice
        <div class="row"><select id="setVoice" aria-label="Voice"></select><button id="voicePreview" class="text-btn" type="button">Play</button></div>
        <span id="voiceInfo" class="hint"></span>
        <input id="voiceFile" type="file" accept="audio/*" hidden>
      </div>
      <label id="outputRow" class="field">Reply as<select id="setOutput"><option value="audio">Voice and text</option><option value="text">Text only</option></select></label>
      <label class="field">Microphone<select id="setMic"></select></label>
      <details id="advanced">
        <summary>Advanced</summary>
        <div>
          <label id="greedyRow" class="field inline"><span>Greedy decoding</span><input id="setGreedy" type="checkbox"></label>
          <div id="samplingFields" style="display:flex;flex-direction:column;gap:10px"></div>
          <label id="sliceRow" class="field">Camera detail (image slices)<select id="setSlices"></select></label>
          <span class="hint">Empty fields keep the server's defaults.</span>
        </div>
      </details>
      <button id="settingsReset" class="text-btn" type="button">Reset to defaults</button>
    </form>
  </aside>

  <section id="sheet" class="sheet" data-open="false" aria-label="Transcript">
    <header>
      <span>Transcript</span>
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Close transcript">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div id="transcript" class="transcript"><p class="empty">What the model says will appear here.</p></div>
  </section>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
