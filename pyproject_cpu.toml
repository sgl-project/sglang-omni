[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

# Intel CPU variant of pyproject.toml (see docs/get_started/installation_cpu.md).
# Torch family pinned to +cpu; CUDA-only wheels dropped; deps scoped to the
# CPU-supported models. sglang is verified against v0.5.16 but cannot be
# pinned here -- every published wheel pulls CUDA torch.

[project]
name = "sglang-omni"
version = "0.1.0"
description = "Multi-stage pipeline framework for omni models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # Core runtime
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
    "msgspec",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pybase64>=1.4.0",
    "tabulate",
    "pandas",
    "typer>=0.9.0",

    # CPU PyTorch stack
    "torch==2.12.0",
    "torchvision==0.27.0",
    "torchaudio==2.11.0",
    "transformers==5.12.1",

    # Model loading and processing
    "accelerate>=0.27.0",
    "safetensors>=0.4.3",
    "pillow>=10.0.0",
    "huggingface-hub[hf_xet]>=0.36.0",
    "protobuf>=7.35.1,<8",
    "datasets>=2.14.0",

    # API and serving
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    "websockets>=12.0",
    "openai==2.6.1",
    "openai-harmony==0.0.4",
    "silero-vad>=5.1",
    "onnxruntime>=1.17",

    # Audio and multimodal utilities
    # --- Multimodal preprocessing (needed by Qwen3-Omni/ASR/TTS) ------------
    "qwen-vl-utils==0.0.11",
    "librosa>=0.11.0",
    "av>=16.1.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "einops",

]

[project.optional-dependencies]
# SeedTTS speaker-sim / WER eval + tests (device-agnostic).
eval = [
    "s3prl>=0.4.18",
    "jiwer",
    "openai-whisper==20250625",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
# `all` aliases `eval`.
all = [
    "s3prl>=0.4.18", "jiwer", "openai-whisper==20250625",
    "pytest>=7.0.0", "pytest-asyncio>=0.21.0",
]

[project.scripts]
sgl-omni = "sglang_omni.cli:app"
sgl-omni-router = "sglang_omni_router.serve:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "benchmark: performance benchmark tests (may require GPU and long runtime)",
    "tts_stage(name): select an in-file TTS benchmark CI stage",
    "gpu: requires an accelerator device (auto-skipped without one)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sglang_omni*"]

[tool.setuptools.package-data]
"sglang_omni.models.fishaudio_s2_pro" = ["fish_speech/configs/*.yaml"]
"sglang_omni.models.higgs_tts" = ["configs/*.json"]
